name: Desktop Song Room width and overview copy

on:
  push:
    branches:
      - design/catalog-manager-unification
    paths:
      - scripts/desktop_song_room_width_and_overview_copy.py
      - .github/workflows/desktop-song-room-width-and-overview-copy.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/catalog-manager-unification
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply final desktop patch
        run: python3 scripts/desktop_song_room_width_and_overview_copy.py
      - run: npm ci
      - name: Desktop TDD contracts
        run: >-
          npx vitest run
          src/design-system/desktop-primitives.test.tsx
          src/desktop-finish-contract.test.ts
          src/manager-premium-phase-1.test.tsx
          src/mission-workspace-simplification.test.tsx
          src/mission-task-deliverables.test.tsx
          src/workspace-activity-center.test.tsx
          src/settings-screen.test.tsx
          src/split-confirmation-portal.test.tsx
          src/song-room-manager-hierarchy.test.ts
          src/song-room-red-antler-overview.test.ts
          --environment jsdom --pool=vmThreads
      - name: Full repository suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git diff --cached --check
          git commit -m 'design: verify final desktop system [skip ci]'
          git push origin HEAD:design/catalog-manager-unification
