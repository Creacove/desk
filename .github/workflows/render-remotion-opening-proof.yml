name: Render Remotion Opening Proof

on:
  push:
    branches:
      - marketing/meet-your-manager-motion
    paths:
      - .github/workflows/render-remotion-opening-proof.yml

permissions:
  contents: read

jobs:
  render-opening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout motion branch
        uses: actions/checkout@v5
        with:
          ref: marketing/meet-your-manager-motion

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Render first 12 seconds
        run: |
          mkdir -p out
          npx remotion render src/remotion/index.ts MeetYourManagerMotionProof out/meet-your-manager-opening-proof.mp4 --frames=0-719 --codec=h264 --crf=23 --concurrency=2

      - name: Upload opening proof
        uses: actions/upload-artifact@v4
        with:
          name: meet-your-manager-opening-proof
          path: out/meet-your-manager-opening-proof.mp4
          if-no-files-found: error
          retention-days: 7
