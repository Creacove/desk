name: PR3 Last Assertion Repair

on:
  push:
    branches:
      - agent/record-servicing-manager-mode

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/record-servicing-manager-mode
          fetch-depth: 0

      - name: Update stale Manager document label assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/production-app-shell.test.tsx')
          text = path.read_text()
          old = 'expect(screen.getByRole("button", { name: "Ask Manager to draft" })).toBeInTheDocument();'
          new = 'expect(screen.getByRole("button", { name: "Build with Manager" })).toBeInTheDocument();'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one stale Manager-label assertion, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr3-last-assertion-repair.yml
          git add src/production-app-shell.test.tsx
          git commit -m "test: align document action label with premium UX"
          git push origin HEAD:agent/record-servicing-manager-mode
