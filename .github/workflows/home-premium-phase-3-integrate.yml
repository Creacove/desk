name: Home premium phase 3 integration

on:
  workflow_dispatch:
  push:
    branches:
      - design/home-premium-phase-3

permissions:
  contents: write

concurrency:
  group: home-premium-phase-3-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[home-shell-integrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/home-premium-phase-3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Wire Home brief refresh into the app shell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/ProductionApp.tsx")
          text = path.read_text()

          insertions = [
              (
                  '  const [activeTodayBriefRun, setActiveTodayBriefRun] = useState<{ id: string; mode: TodayBriefGenerationMode } | null>(null);\n',
                  '  const [activeTodayBriefRun, setActiveTodayBriefRun] = useState<{ id: string; mode: TodayBriefGenerationMode } | null>(null);\n  const todayBriefRefreshInFlight = useRef(false);\n',
                  'const todayBriefRefreshInFlight = useRef(false);',
                  'brief refresh request guard',
              ),
              (
                  '  async function refreshPublicContext() {\n',
                  '  async function refreshTodaysBrief() {\n    if (todayBriefRefreshInFlight.current || todayBriefPending || activeTodayBriefRun) return;\n    todayBriefRefreshInFlight.current = true;\n    try {\n      await generateTodaysBrief("operating");\n    } catch {\n      // generateTodaysBrief owns the local error state; keep the existing brief visible.\n    } finally {\n      todayBriefRefreshInFlight.current = false;\n    }\n  }\n\n  async function refreshPublicContext() {\n',
                  'async function refreshTodaysBrief()',
                  'brief refresh wrapper',
              ),
              (
                  '              onOpenActivityCenter={openActivityCenter}\n',
                  '              onOpenActivityCenter={openActivityCenter}\n              briefPending={todayBriefPending}\n              onRefreshBrief={() => void refreshTodaysBrief()}\n',
                  'onRefreshBrief={() => void refreshTodaysBrief()}',
                  'Home refresh props',
              ),
          ]

          for old, new, marker, label in insertions:
              if marker in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label} insertion point, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Migrate Home shell regression contracts
        shell: bash
        run: |
          python - <<'PY'
          from base64 import b64decode
          from pathlib import Path

          path = Path("src/production-app-shell.test.tsx")
          text = path.read_text()

          def decode(value: str) -> str:
              return b64decode(value).decode("utf-8")

          def test_bounds(title: str):
              marker = f'  it("{title}", async () => {{'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"Could not find Home regression test: {title}")
              next_test = text.find('\n  it("', start + len(marker))
              if next_test < 0:
                  next_test = text.find("\n});", start)
              if next_test < 0:
                  raise SystemExit(f"Could not find end of Home regression test: {title}")
              return start, next_test

          def replace_assertions(title: str, assertions: str):
              global text
              start, end = test_bounds(title)
              block = text[start:end]
              marker = '    expect(await screen.findAllByRole("heading", { name: "Home" }).then(([heading]) => heading)).toBeInTheDocument();'
              assertion_start = block.find(marker)
              close = block.rfind("  }, 20000);")
              if assertion_start < 0 or close < 0:
                  raise SystemExit(f"Could not rewrite Home regression assertions: {title}")
              text = text[:start] + block[:assertion_start] + assertions.rstrip() + "\n  }, 20000);" + text[end:]

          def replace_test(title: str, replacement: str):
              global text
              start, end = test_bounds(title)
              text = text[:start] + replacement.rstrip() + text[end:]
          replace_assertions("opens Desk HQ from real repositories without Sable Day or Night Bus fallback copy", decode(""))
          replace_assertions("renders a generated Manager-language Today's Brief and refreshes it from saved sources", decode(""))
          replace_assertions("keeps Today's Attention in the active visual mode instead of inverting the primary card", decode(""))
          replace_assertions("keeps Desk HQ artist-facing sections compact and low-overload", decode(""))
          replace_assertions("puts mobile Desk HQ attention and movement behind a notification sheet", decode(""))
          replace_assertions("keeps Desk HQ movement compact and moves older activity into history", decode(""))
          replace_assertions("keeps mobile Desk HQ useful with titled expandable manager read, paragraphs, full metrics, and team agents", decode(""))
          replace_assertions("renders saved Today's Brief copy instead of dropping it for style-policy terms", decode(""))
          replace_assertions("expands a long Manager's Read at paragraph boundaries without losing the full read", decode(""))
          replace_test("turns Desk HQ command brief clicks into Manager and mission destinations without exposing the old command strip", decode(""))
          text = text.replace(
              'it("keeps mobile Desk HQ useful with titled expandable manager read, paragraphs, full metrics, and team agents",',
              'it("keeps the unified Home read complete without desktop/mobile duplication",',
              1,
          )
          text = text.replace(
              'it("puts mobile Desk HQ attention and movement behind a notification sheet",',
              'it("keeps mobile Activity access in global chrome without duplicating Home",',
              1,
          )

          forbidden_positive_patterns = [
              'getByTestId("desk-mobile-manager-read',
              'getByTestId("desk-desktop-manager-read',
              'getByTestId("desk-todays-focus',
              'getByTestId("desk-manager-read-card',
              'getAllByTestId("desk-signal-metric-card',
          ]
          for pattern in forbidden_positive_patterns:
              if pattern in text:
                  raise SystemExit(f"Stale positive Home assertion remains: {pattern}")

          path.write_text(text)
          PY

      - run: npm ci --no-audit --no-fund
      - name: Focused Home shell contracts
        run: |
          npx vitest run \
            src/desk-hq-editorial.test.tsx \
            src/production-app-shell.test.tsx \
            --environment jsdom --pool=vmThreads
      - run: npm run build
      - run: git diff --check

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet -- src/app/ProductionApp.tsx src/production-app-shell.test.tsx; then
            echo "App shell and regression contracts already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/ProductionApp.tsx src/production-app-shell.test.tsx
          git commit -m "Update premium Home shell regression contracts [home-shell-integrated]"
          git push origin HEAD:design/home-premium-phase-3
