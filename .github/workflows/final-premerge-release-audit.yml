name: Final pre-merge release audit

on:
  push:
    branches:
      - design/home-premium-phase-3
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-premerge-release-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[final-audit-clean]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/home-premium-phase-3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y chromium

      - name: Verify complete redesign ancestry
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA=f8e56acca69dfaf38e8f4f8a6fb63a195d13c420
          MANAGER_SHA=2ef20d0d13bd64f855d510ecdbda79b03af51d8e
          git merge-base --is-ancestor "$MAIN_SHA" HEAD
          git merge-base --is-ancestor "$MANAGER_SHA" HEAD
          test "$(git rev-list --count HEAD..origin/main)" = "0"
          echo "Current branch contains Manager redesign and is not behind main."

      - name: Focused redesigned product contracts
        run: |
          npx vitest run \
            src/manager-premium-phase-1.test.tsx \
            src/manager-interruption-ui.test.tsx \
            src/release-success-conversation.test.tsx \
            src/record-servicing-opportunity-ui.test.tsx \
            src/desk-hq-editorial.test.tsx \
            src/workspace-activity-center.test.tsx \
            src/workspace-live-sync.test.ts \
            src/mission-workspace-simplification.test.tsx \
            src/catalog-manager-beauty-pass.test.ts \
            src/production-app-shell.test.tsx \
            --environment jsdom --pool=vmThreads

      - name: Full repository suite
        run: npm test

      - name: Production environment contract
        env:
          VITE_APP_MODE: production
          APP_ENVIRONMENT: production
          VITE_SUPABASE_URL: https://qa-release.supabase.co
          VITE_SUPABASE_ANON_KEY: qa-release-anon-key
          SUPABASE_SERVICE_ROLE_KEY: qa-release-service-role-key
          OPENAI_API_KEY: qa-release-openai-key
          APP_RELEASE: premerge-qa
          PUBLIC_APP_URL: https://desk.qa.ordersounds.com
          SPOTIFY_CLIENT_ID: qa-release-spotify-client
          SPOTIFY_CLIENT_SECRET: qa-release-spotify-secret
          SPOTIFY_REDIRECT_URI: https://desk.qa.ordersounds.com/auth/spotify/callback
        run: npm run env:check:production

      - name: Production build
        env:
          VITE_APP_MODE: production
          VITE_SUPABASE_URL: https://qa-release.supabase.co
          VITE_SUPABASE_ANON_KEY: qa-release-anon-key
        run: npm run build

      - name: TypeScript regression against pre-redesign main
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=f8e56acca69dfaf38e8f4f8a6fb63a195d13c420
          mkdir -p /tmp/final-ts
          npx tsc --noEmit --pretty false > /tmp/final-ts/head.txt 2>&1 || true
          grep -E 'error TS[0-9]+:' /tmp/final-ts/head.txt | sed -E 's/\([0-9]+,[0-9]+\)//g' | sort -u > /tmp/final-ts/head-errors.txt || true
          git worktree add --detach /tmp/final-main "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/final-main/node_modules
          (cd /tmp/final-main && ./node_modules/.bin/tsc --noEmit --pretty false > /tmp/final-ts/base.txt 2>&1 || true)
          grep -E 'error TS[0-9]+:' /tmp/final-ts/base.txt | sed -E 's/\([0-9]+,[0-9]+\)//g' | sort -u > /tmp/final-ts/base-errors.txt || true
          comm -13 /tmp/final-ts/base-errors.txt /tmp/final-ts/head-errors.txt > /tmp/final-ts/new-errors.txt
          echo "Baseline TypeScript errors: $(wc -l < /tmp/final-ts/base-errors.txt)"
          echo "Head TypeScript errors: $(wc -l < /tmp/final-ts/head-errors.txt)"
          echo "New TypeScript errors: $(wc -l < /tmp/final-ts/new-errors.txt)"
          if [ -s /tmp/final-ts/new-errors.txt ]; then cat /tmp/final-ts/new-errors.txt; exit 1; fi

      - name: Start production preview and Chromium
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/final-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep .25
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          chromium --headless=new --no-sandbox --disable-gpu \
            --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 \
            --user-data-dir=/tmp/final-chrome --window-size=1440,1000 \
            about:blank > /tmp/final-chrome.log 2>&1 &

      - name: Cross-product production Chromium smoke
        env:
          DESK_SMOKE_URL: http://127.0.0.1:4173/?fixtures=true&view=labelHQ
        run: node scripts/chrome-production-smoke.mjs

      - name: Desktop and mobile runtime/layout smoke
        shell: bash
        run: |
          cat > /tmp/final-responsive-smoke.mjs <<'NODE'
          import http from 'node:http';
          const wait = ms => new Promise(r => setTimeout(r, ms));
          const timeout = 20000;
          function getJson(path){return new Promise((resolve,reject)=>{http.get({host:'127.0.0.1',port:9222,path},res=>{let b='';res.on('data',c=>b+=c);res.on('end',()=>{try{resolve(JSON.parse(b))}catch(e){reject(e)}})}).on('error',reject)})}
          let wsUrl;
          for(let i=0;i<80&&!wsUrl;i++){try{const pages=await getJson('/json');wsUrl=pages.find(p=>p.type==='page')?.webSocketDebuggerUrl}catch{}if(!wsUrl)await wait(250)}
          if(!wsUrl) throw new Error('Chromium debugger unavailable');
          const ws=new WebSocket(wsUrl); await new Promise((r,j)=>{ws.addEventListener('open',r,{once:true});ws.addEventListener('error',j,{once:true})});
          let id=0; const pending=new Map(); const failures=[];
          ws.addEventListener('message',e=>{const m=JSON.parse(String(e.data));if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.j(new Error(m.error.message)):p.r(m.result);return}if(m.method==='Runtime.exceptionThrown')failures.push(m.params?.exceptionDetails?.exception?.description||m.params?.exceptionDetails?.text||'runtime error');if(m.method==='Runtime.consoleAPICalled'&&m.params?.type==='error')failures.push((m.params.args||[]).map(a=>a.value||a.description||'console error').join(' '))});
          const cmd=(method,params={})=>new Promise((r,j)=>{const n=++id;pending.set(n,{r,j});ws.send(JSON.stringify({id:n,method,params}))});
          const evalJs=async expression=>{const r=await cmd('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw new Error(r.exceptionDetails.text||'evaluation failed');return r.result?.value};
          await cmd('Runtime.enable'); await cmd('Page.enable');
          async function visit(view,width,height,needle){failures.length=0;await cmd('Emulation.setDeviceMetricsOverride',{width,height,deviceScaleFactor:1,mobile:width<700});await cmd('Page.navigate',{url:`http://127.0.0.1:4173/?fixtures=true&view=${view}`});const started=Date.now();while(Date.now()-started<timeout){const text=await evalJs("document.body?.innerText ?? ''");if(String(text).toLowerCase().includes(needle.toLowerCase()))break;await wait(200)}await wait(400);const state=await evalJs(`(()=>({text:(document.body?.innerText||'').slice(0,1000),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,buttons:[...document.querySelectorAll('button')].filter(b=>b.getBoundingClientRect().width>0&&b.getBoundingClientRect().height>0).length}))()`);if(!state.text.toLowerCase().includes(needle.toLowerCase()))throw new Error(`${view} failed to render ${needle}`);if(state.overflow>1)throw new Error(`${view} overflows horizontally by ${state.overflow}px at ${width}px`);if(failures.length)throw new Error(`${view} runtime errors at ${width}px:\n${failures.join('\n')}`);}
          for(const [view,needle] of [['labelHQ','Home'],['managerOffice','Manager'],['missionsWorkspace','Missions'],['artistProfileWorkspace','Settings']]){await visit(view,1440,1000,needle);await visit(view,390,844,needle)}
          ws.close(); console.log('Desktop/mobile cross-product smoke passed.');
          NODE
          node /tmp/final-responsive-smoke.mjs

      - name: Final diff hygiene
        run: git diff --check f8e56acca69dfaf38e8f4f8a6fb63a195d13c420..HEAD

      - name: Remove temporary final audit workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-premerge-release-audit.yml
          git commit -m "Remove temporary final pre-merge audit [final-audit-clean]"
          git push origin HEAD:design/home-premium-phase-3
