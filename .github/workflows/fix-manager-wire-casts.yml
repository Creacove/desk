name: Fix Manager wire casts

on:
  push:
    branches:
      - fix/manager-turn-contract

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/manager-turn-contract
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Keep presentation metadata runtime-rich but domain-type neutral
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          path = Path('src/services/productionSupabase.ts')
          text = path.read_text()

          text = replace_once(
              text,
              'type ManagerTurnPresentationWire = { version: 1; surfaces: Array<"release_success" | "release_opportunities" | "decision_package" | "release_share_package">; visibleArtifactIds: string[]; decisionPackageId?: string };',
              'type ManagerTurnPresentationWire = { version: 1; surfaces: Array<"release_success" | "release_opportunities" | "decision_package" | "release_share_package">; visibleArtifactIds: string[]; decisionPackageId?: string };\ntype ManagerConversationMessageWire = ConversationViewModel["messages"][number] & { presentation?: ManagerTurnPresentationWire };\ntype ManagerCreatedWorkWire = NonNullable<ConversationViewModel["createdWork"]>[number] & { presentationRole?: "deliverable" | "internal_support" | "compatibility"; visibility?: "user" | "internal" };',
              'wire helper types',
          )

          text = replace_once(
              text,
              '  const latestManagerPresentation = [...mappedMessages].reverse().find((message) => message.speaker === "manager")?.presentation;',
              '  const latestManagerPresentation = ([...mappedMessages].reverse().find((message) => message.speaker === "manager") as ManagerConversationMessageWire | undefined)?.presentation;',
              'turn presentation access',
          )

          text = replace_once(
              text,
              '''  return {\n    id: row.id,\n    speaker,\n    label: row.label ?? (speaker === "artist" ? "You" : "Manager"),\n    body: row.body,\n    ...(createdWork.length ? { createdWork } : {}),\n    ...(contextQuestions.length ? { contextQuestions } : {}),\n    ...(contextAnswers.length ? { contextAnswers } : {}),\n    ...(attachments.length ? { attachments } : {}),\n    ...(contextRequestId ? { contextRequestId } : {}),\n    ...(presentation ? { presentation } : {}),\n  };''',
              '''  return ({\n    id: row.id,\n    speaker,\n    label: row.label ?? (speaker === "artist" ? "You" : "Manager"),\n    body: row.body,\n    ...(createdWork.length ? { createdWork } : {}),\n    ...(contextQuestions.length ? { contextQuestions } : {}),\n    ...(contextAnswers.length ? { contextAnswers } : {}),\n    ...(attachments.length ? { attachments } : {}),\n    ...(contextRequestId ? { contextRequestId } : {}),\n    ...(presentation ? { presentation } : {}),\n  } as ManagerConversationMessageWire);''',
              'row mapper cast',
          )

          text = replace_once(
              text,
              '''        return {\n          id: readConversationString(message.id, `message-${index}`),\n          speaker,\n          label: readConversationString(message.label, speaker === "artist" ? "You" : "Manager"),\n          body: readConversationString(message.body, ""),\n          ...(createdWork.length ? { createdWork } : {}),\n          ...(contextQuestions.length ? { contextQuestions } : {}),\n          ...(contextAnswers.length ? { contextAnswers } : {}),\n          ...(attachments.length ? { attachments } : {}),\n          ...(contextRequestId ? { contextRequestId } : {}),\n          ...(presentation ? { presentation } : {}),\n        };''',
              '''        return ({\n          id: readConversationString(message.id, `message-${index}`),\n          speaker,\n          label: readConversationString(message.label, speaker === "artist" ? "You" : "Manager"),\n          body: readConversationString(message.body, ""),\n          ...(createdWork.length ? { createdWork } : {}),\n          ...(contextQuestions.length ? { contextQuestions } : {}),\n          ...(contextAnswers.length ? { contextAnswers } : {}),\n          ...(attachments.length ? { attachments } : {}),\n          ...(contextRequestId ? { contextRequestId } : {}),\n          ...(presentation ? { presentation } : {}),\n        } as ManagerConversationMessageWire);''',
              'API mapper cast',
          )

          text = replace_once(
              text,
              '.map((item): ConversationViewModel["createdWork"][number] => ({',
              '.map((item): ManagerCreatedWorkWire => ({',
              'created work wire subtype',
          )

          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Compare browser TypeScript diagnostics exactly like PR Safety
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          BASE_SHA="$(git rev-parse origin/main)"
          git checkout --detach "$BASE_SHA"
          npx tsc --noEmit --pretty false > /tmp/tsc-base.txt 2>&1 || true
          git checkout --detach "$HEAD_SHA"
          npx tsc --noEmit --pretty false > /tmp/tsc-head.txt 2>&1 || true
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re, sys
          location = re.compile(r'\(\d+,\d+\)')
          def diagnostics(path):
              lines=[]
              for raw in Path(path).read_text(errors='replace').splitlines():
                  line=location.sub('(LINE,COL)', raw.strip())
                  if line.startswith('supabase/functions/') and 'error TS5097:' in line:
                      continue
                  lines.append(line)
              return Counter(lines)
          base=diagnostics('/tmp/tsc-base.txt'); head=diagnostics('/tmp/tsc-head.txt')
          added=head-base
          if added:
              print('New diagnostics:')
              for line,count in sorted(added.items()):
                  for _ in range(count): print('+',line)
              sys.exit(1)
          print('No new browser TypeScript diagnostics introduced.')
          PY
          git checkout fix/manager-turn-contract
      - name: Test Manager contracts
        run: npx vitest run --environment jsdom --pool=vmThreads src/manager-turn-contract.test.ts src/features/manager/managerArtifactExperience.test.ts src/manager-document-navigation-contract.test.ts
      - name: Check Manager Edge functions
        run: deno check supabase/functions/manager-conversation/index.ts supabase/functions/manager-conversation-stream/index.ts
      - name: Build production frontend
        run: npm run build
      - name: Commit validated casts
        run: |
          git rm .github/workflows/fix-manager-wire-casts.yml .github/workflows/inspect-manager-wire-types.yml
          git add src/services/productionSupabase.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve Manager wire metadata without browser type drift"
          git push origin HEAD:fix/manager-turn-contract
