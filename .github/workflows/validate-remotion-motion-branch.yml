name: Validate Remotion Launch Film

on:
  push:
    branches:
      - marketing/meet-your-manager-motion
    paths:
      - src/remotion/**
      - src/marketing/launch-film/FilmStudio.tsx
      - public/launch-assets/**
      - package.json
      - package-lock.json
      - .github/workflows/validate-remotion-motion-branch.yml

permissions:
  contents: read

jobs:
  validate-film:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: ci-test-anon-key
    steps:
      - name: Checkout motion branch
        uses: actions/checkout@v5
        with:
          ref: marketing/meet-your-manager-motion

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Ensure culturally aligned film media
        run: |
          mkdir -p public/launch-assets /tmp/launch-film-media

          curl -L --fail --retry 3 -o /tmp/launch-film-media/urban-performance.mp4 \
            "https://videos.pexels.com/video-files/3890372/3890372-hd_1920_1080_30fps.mp4"
          curl -L --fail --retry 3 -o /tmp/launch-film-media/singer-closeup.mp4 \
            "https://videos.pexels.com/video-files/8117116/8117116-hd_1920_1080_25fps.mp4"

          ffmpeg -y -ss 00:00:01.5 -i /tmp/launch-film-media/urban-performance.mp4 -frames:v 1 -update 1 -vf "scale=1800:-2" -q:v 3 public/launch-assets/lagos-artist.jpg
          ffmpeg -y -ss 00:00:02.0 -i /tmp/launch-film-media/singer-closeup.mp4 -frames:v 1 -update 1 -vf "scale=1800:-2" -q:v 3 public/launch-assets/lagos-artist-shoot.jpg
          ffmpeg -y -ss 00:00:04.0 -i /tmp/launch-film-media/urban-performance.mp4 -frames:v 1 -update 1 -vf "scale=1800:-2" -q:v 3 public/launch-assets/lagos-creator-team.jpg

      - name: Build app with embedded Remotion Player
        run: npm run build

      - name: Compile production Desk CSS for Remotion
        run: npx tailwindcss -c tailwind.config.ts -i src/index.css -o public/remotion-app.css --minify

      - name: Discover Remotion compositions
        run: npx remotion compositions src/remotion/index.ts

      - name: Render final vertical master
        run: |
          mkdir -p out/final
          npx remotion render src/remotion/index.ts MeetYourManagerPreview out/final/meet-your-manager-launch.mp4 \
            --codec=h264 \
            --crf=18 \
            --pixel-format=yuv420p \
            --concurrency=4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 out/final/meet-your-manager-launch.mp4

      - name: Upload final vertical master
        uses: actions/upload-artifact@v4
        with:
          name: meet-your-manager-launch-master
          path: out/final/meet-your-manager-launch.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
