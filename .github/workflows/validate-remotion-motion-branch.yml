name: Validate Remotion Launch Film

on:
  push:
    branches:
      - marketing/meet-your-manager-motion
    paths:
      - src/remotion/**
      - src/marketing/launch-film/FilmStudio.tsx
      - package.json
      - package-lock.json
      - .github/workflows/validate-remotion-motion-branch.yml

permissions:
  contents: read

jobs:
  validate-film:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: ci-test-anon-key
    steps:
      - name: Checkout motion branch
        uses: actions/checkout@v5
        with:
          ref: marketing/meet-your-manager-motion

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build app with embedded Remotion Player
        run: npm run build

      - name: Compile production Desk CSS for Remotion
        run: npx tailwindcss -c tailwind.config.ts -i src/index.css -o public/remotion-app.css --minify

      - name: Discover Remotion compositions
        run: npx remotion compositions src/remotion/index.ts

      - name: Render V3 phone focal beats
        run: |
          mkdir -p out/validation
          npx remotion still src/remotion/index.ts MeetYourManagerPreview out/validation/01-opening.png --frame=150
          npx remotion still src/remotion/index.ts MeetYourManagerPreview out/validation/02-manager.png --frame=420
          npx remotion still src/remotion/index.ts MeetYourManagerPreview out/validation/03-context.png --frame=735
          npx remotion still src/remotion/index.ts MeetYourManagerPreview out/validation/04-today.png --frame=960
          npx remotion still src/remotion/index.ts MeetYourManagerPreview out/validation/05-created-work.png --frame=1240
          npx remotion still src/remotion/index.ts MeetYourManagerPreview out/validation/06-task-sheet.png --frame=1540
          npx remotion still src/remotion/index.ts MeetYourManagerPreview out/validation/07-adapt.png --frame=1880
          npx remotion still src/remotion/index.ts MeetYourManagerPreview out/validation/08-watch.png --frame=2130
          npx remotion still src/remotion/index.ts MeetYourManagerPreview out/validation/09-approval.png --frame=2320
          npx remotion still src/remotion/index.ts MeetYourManagerPreview out/validation/10-end.png --frame=2490

      - name: Upload validation stills
        uses: actions/upload-artifact@v4
        with:
          name: remotion-v3-production-styled-phone-beats
          path: out/validation/*.png
          if-no-files-found: error
          retention-days: 7
