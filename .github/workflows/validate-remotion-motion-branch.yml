name: Validate Remotion Launch Film

on:
  push:
    branches:
      - marketing/meet-your-manager-motion
    paths:
      - src/remotion/**
      - src/marketing/launch-film/FilmStudio.tsx
      - package.json
      - package-lock.json
      - .github/workflows/validate-remotion-motion-branch.yml

permissions:
  contents: read

jobs:
  validate-film:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: ci-test-anon-key
    steps:
      - name: Checkout motion branch
        uses: actions/checkout@v5
        with:
          ref: marketing/meet-your-manager-motion

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build app with embedded Remotion Player
        run: npm run build

      - name: Discover Remotion compositions
        run: npx remotion compositions src/remotion/index.ts

      - name: Render motion validation stills
        run: |
          mkdir -p out/validation
          npx remotion still src/remotion/index.ts MeetYourManagerVertical out/validation/frame-0845-context-to-work.png --frame=845
          npx remotion still src/remotion/index.ts MeetYourManagerVertical out/validation/frame-1280-work-to-task.png --frame=1280
          npx remotion still src/remotion/index.ts MeetYourManagerVertical out/validation/frame-1600-task-to-adapt.png --frame=1600
          npx remotion still src/remotion/index.ts MeetYourManagerVertical out/validation/frame-2190-watch-to-approval.png --frame=2190
          npx remotion still src/remotion/index.ts MeetYourManagerVertical out/validation/frame-2390-approval-to-end.png --frame=2390

      - name: Upload validation stills
        uses: actions/upload-artifact@v4
        with:
          name: remotion-validation-stills-v2
          path: out/validation/*.png
          if-no-files-found: error
          retention-days: 7
