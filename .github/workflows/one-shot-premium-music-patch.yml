name: One-shot premium Music room patch

on:
  push:
    branches:
      - agent/record-servicing-manager-mode
    paths:
      - .github/workflows/one-shot-premium-music-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/record-servicing-manager-mode
          fetch-depth: 0

      - name: Apply narrow Music workspace patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/features/music/MusicScreens.tsx")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              'import { AlertCircle, ArrowLeft, ArrowRight, Check, ChevronRight, Copy, Disc3, Download, FileAudio, FileText, Image as ImageIcon, ListMusic, Loader2, Pencil, Play, Plus, RefreshCw, RotateCcw, Search, Share2, Sparkles, Trash2, Upload, UsersRound, X } from "lucide-react";',
              'import { AlertCircle, ArrowLeft, ArrowRight, Check, ChevronRight, Copy, Disc3, Download, FileAudio, FileText, Image as ImageIcon, ListMusic, Loader2, MessageCircle, Pencil, Play, Plus, RefreshCw, RotateCcw, Search, Share2, Sparkles, Trash2, Upload, UsersRound, X } from "lucide-react";',
              "lucide import",
          )

          old_prompt = '''  const releaseKitPrompt = campaign.phase === "post_release"
            ? `Build the campaign kit for ${song.title}. This record is already released, so do not reopen pre-release gates or Spotify editorial pitching. Start from the current files, lyrics, metadata, rights, public context, and existing campaign work. Create only the EPK, bio, one-sheet, press angles, pitches, or other canonical materials this servicing campaign actually needs, save each document to the song, and ask me only for information you cannot verify.`
            : `Build the release kit for ${song.title}. Start from the song's current files, lyrics, metadata, rights, release context, and existing campaign work. Create the EPK, bio, one-sheet, press angles, channel-ready pitches, and other canonical materials this release actually needs, save each document to the song, and ask me only for information you cannot verify.`;'''
          new_prompt = '''  const releaseKitPrompt = campaign.phase === "post_release"
            ? `Build the campaign system for ${song.title}. This record is already released, so do not reopen pre-release gates or Spotify editorial pitching. First read the current song, evidence, Files, rights and existing campaign work. Establish or refresh one canonical Release Narrative before creating recipient-facing material. Then create only the smallest set of EPK, bio, one-sheet, press angles, playlist or press pitches, content plan, or other canonical artifacts that the next servicing move actually needs. Every external artifact must inherit the Release Narrative, use verified facts and source-backed claims, put unknown facts in missingInputs instead of placeholders, and pass the document quality gate. If the gate rejects a draft, repair the named blockers before replying. Save every accepted artifact to this song and ask me only for information you cannot verify.`
            : `Build the release system for ${song.title}. First read the current song, evidence, Files, rights, release context and existing campaign work. Establish or refresh one canonical Release Narrative covering positioning, release story, audience, campaign thesis, proof, creative world and language guardrails. Then create only the smallest set of EPK, bio, one-sheet, press release, press angles, channel-ready pitches, content plan, release calendar or other canonical artifacts this release actually needs. Every external artifact must inherit the Release Narrative, use verified facts and source-backed claims, put unknown facts in missingInputs instead of placeholders, and pass the document quality gate. If the gate rejects a draft, repair the named blockers before replying. Save every accepted artifact to this song and ask me only for information you cannot verify.`;'''
          replace_once(old_prompt, new_prompt, "release kit prompt")

          replace_once(
              '      <MusicDetailTop object={song} label="Song room" onBack={onBack} onStageChange={onStageChange} />',
              '      <MusicDetailTop object={song} label="Song room" onBack={onBack} onStageChange={onStageChange} onOpenManager={onContinueWithManager} />',
              "song detail header",
          )
          replace_once(
              '      <MusicDetailTop object={project} label="Project" onBack={onBack} />',
              '      <MusicDetailTop object={project} label="Project" onBack={onBack} onOpenManager={onContinueWithManager} />',
              "project detail header",
          )

          old_signature = 'function MusicDetailTop({ object, label, onBack, onStageChange }: { object: MusicObjectViewModel; label: string; onBack: () => void; onStageChange?: (stage: string) => void }) {'
          new_signature = 'function MusicDetailTop({ object, label, onBack, onStageChange, onOpenManager }: { object: MusicObjectViewModel; label: string; onBack: () => void; onStageChange?: (stage: string) => void; onOpenManager?: () => void }) {'
          replace_once(old_signature, new_signature, "MusicDetailTop signature")

          old_mobile_actions = '''          <div className="flex min-w-0 items-center justify-end gap-1.5">
            <span className="rounded-full bg-foreground/[0.055] px-2.5 py-1 text-[10px] font-semibold text-muted-foreground">{label}</span>
            {lockedReleasedStage ? (
              <span data-testid="mobile-locked-song-stage" className="rounded-full bg-brand-accent/10 px-2.5 py-1 text-[10px] font-bold text-brand-accent">{stageValue}</span>
            ) : null}
          </div>'''
          new_mobile_actions = '''          <div className="flex min-w-0 items-center justify-end gap-1.5">
            <span className="hidden rounded-full bg-foreground/[0.055] px-2.5 py-1 text-[10px] font-semibold text-muted-foreground sm:inline-flex">{label}</span>
            {lockedReleasedStage ? (
              <span data-testid="mobile-locked-song-stage" className="hidden rounded-full bg-brand-accent/10 px-2.5 py-1 text-[10px] font-bold text-brand-accent sm:inline-flex">{stageValue}</span>
            ) : null}
            {onOpenManager ? (
              <button type="button" aria-label={`Open Manager for ${object.title}`} onClick={onOpenManager} className="inline-flex h-9 shrink-0 items-center gap-1.5 rounded-[10px] border border-foreground/10 bg-background px-2.5 text-[11px] font-semibold text-foreground shadow-sm hover:bg-foreground/[0.04] focus:outline-none focus:ring-2 focus:ring-brand-accent/25">
                <MessageCircle className="h-3.5 w-3.5" aria-hidden="true" />
                Manager
              </button>
            ) : null}
          </div>'''
          replace_once(old_mobile_actions, new_mobile_actions, "mobile Manager action")

          old_desktop_back = '''        <button type="button" onClick={onBack} className="mb-5 inline-flex items-center gap-2 text-[12px] font-semibold text-muted-foreground hover:text-foreground">
          <ArrowLeft className="h-4 w-4" />
          Back to Catalog
        </button>'''
          new_desktop_back = '''        <div className="mb-5 flex items-center justify-between gap-3">
          <button type="button" onClick={onBack} className="inline-flex items-center gap-2 text-[12px] font-semibold text-muted-foreground hover:text-foreground">
            <ArrowLeft className="h-4 w-4" />
            Back to Catalog
          </button>
          {onOpenManager ? (
            <button type="button" aria-label={`Open Manager for ${object.title}`} onClick={onOpenManager} className="inline-flex h-9 items-center gap-1.5 rounded-[10px] border border-foreground/10 bg-background px-3 text-[11px] font-semibold text-foreground shadow-sm transition-colors hover:border-foreground/18 hover:bg-foreground/[0.035] focus:outline-none focus:ring-2 focus:ring-brand-accent/25">
              <MessageCircle className="h-3.5 w-3.5" aria-hidden="true" />
              Manager
            </button>
          ) : null}
        </div>'''
          replace_once(old_desktop_back, new_desktop_back, "desktop Manager action")

          project_brief = '          <MusicProjectBrief project={project} onGenerateBrief={onGenerateBrief} onContinueWithManager={onContinueWithManager} briefPending={briefPending} briefError={briefError} />\n'
          if text.count(project_brief) != 1:
              raise SystemExit(f"project brief: expected exactly 1 match, found {text.count(project_brief)}")
          text = text.replace(project_brief, '', 1)
          project_grid = '        <div className="grid gap-5">\n          <div className="surface-elevated overflow-hidden rounded-[22px] shadow-sm">'
          project_grid_replacement = '        <div className="grid gap-5">\n          <MusicProjectBrief project={project} onGenerateBrief={onGenerateBrief} onContinueWithManager={onContinueWithManager} briefPending={briefPending} briefError={briefError} />\n          <div className="surface-elevated overflow-hidden rounded-[22px] shadow-sm">'
          replace_once(project_grid, project_grid_replacement, "project decision-first order")

          path.write_text(text)
          PY

          git diff --check
          git diff -- src/features/music/MusicScreens.tsx

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-premium-music-patch.yml
          git add src/features/music/MusicScreens.tsx
          git commit -m "feat: make Music rooms Manager-first without added clutter"
          git push origin HEAD:agent/record-servicing-manager-mode
