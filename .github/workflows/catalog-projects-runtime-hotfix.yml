name: Catalog Projects runtime hotfix

on:
  push:
    branches:
      - hotfix/catalog-projects-blank-screen
    paths:
      - scripts/fix_catalog_projects_runtime.py
      - src/design-system/AppThinkingOrb.tsx
      - src/design-system/app-thinking-orb.test.tsx
      - .github/workflows/catalog-projects-runtime-hotfix.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hotfix/catalog-projects-blank-screen
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply project runtime hardening
        run: python3 scripts/fix_catalog_projects_runtime.py
      - name: Thinking orb regression
        run: npx vitest run src/design-system/app-thinking-orb.test.tsx --environment jsdom --pool=vmThreads
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Catalog beauty contract
        run: npx vitest run src/catalog-manager-beauty-pass.test.ts --environment jsdom --pool=vmThreads
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Production shell regressions
        run: npx vitest run src/production-app-shell.test.tsx --environment jsdom --pool=vmThreads
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Full repository suite
        run: npx vitest run --environment jsdom --pool=vmThreads
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Commit generated source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/music/MusicScreens.tsx
          if git diff --cached --quiet; then
            echo 'No generated source changes to commit.'
          else
            git commit -m 'fix: prevent Catalog project runtime crashes'
            git push origin HEAD:hotfix/catalog-projects-blank-screen
          fi
