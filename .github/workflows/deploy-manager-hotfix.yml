name: Prepare Manager deploy bundles

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-manager-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Bundle Manager functions
        run: |
          mkdir -p .deploy-bundles
          deno bundle --no-check --packages=external --external='https://*' --external='http://*' --external='jsr:*' --external='npm:*' -o .deploy-bundles/manager-conversation.ts supabase/functions/manager-conversation/index.ts
          deno bundle --no-check --packages=external --external='https://*' --external='http://*' --external='jsr:*' --external='npm:*' -o .deploy-bundles/manager-conversation-stream.ts supabase/functions/manager-conversation-stream/index.ts
          wc -c -l .deploy-bundles/*.ts | tee .deploy-bundles/manifest.txt

      - name: Commit deploy bundles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-bundles
          git commit -m 'chore: prepare manager deploy bundles'
          git push origin main
