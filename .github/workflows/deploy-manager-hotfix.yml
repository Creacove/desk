name: Deploy Manager hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-manager-hotfix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy manager-conversation
        run: supabase functions deploy manager-conversation --project-ref bbwbxmnanccwottrmkqu

      - name: Deploy manager-conversation-stream
        run: supabase functions deploy manager-conversation-stream --project-ref bbwbxmnanccwottrmkqu
