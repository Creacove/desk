name: Implement premium Manager artifacts

on:
  push:
    branches:
      - agent/premium-manager-artifact-experience
    paths:
      - .github/workflows/implement-premium-manager-artifacts.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: agent/premium-manager-artifact-experience

      - name: Apply product and backend fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace(path, old, new, count=1):
              text = read(path)
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), found {found}: {old[:100]!r}")
              write(path, text.replace(old, new, count))

          def replace_all(path, old, new, minimum=1):
              text = read(path)
              found = text.count(old)
              if found < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} occurrence(s), found {found}: {old[:100]!r}")
              write(path, text.replace(old, new))

          def sub(path, pattern, replacement, count=1, flags=re.S):
              text = read(path)
              next_text, n = re.subn(pattern, replacement, text, count=count, flags=flags)
              if n != count:
                  raise SystemExit(f"{path}: regex replacement expected {count}, got {n}: {pattern[:100]!r}")
              write(path, next_text)

          # Browser types: song documents are first-class Manager work products.
          replace_all(
              "src/types/cleanProduction.ts",
              'artifactKind?: "task_draft";\n    content?: string;',
              'artifactKind?: "task_draft" | "song_document";\n    content?: string;\n    musicItemId?: string;\n    documentType?: string;\n    readiness?: "ready" | "needs_review" | "save_failed";\n    missingInputs?: string[];',
              minimum=2,
          )

          # Backend created-work type carries the same document receipt metadata.
          replace(
              "supabase/functions/_shared/openaiManagerConversationLegacy.ts",
              '  parentMissionId?: string;\n  status?: "created" | "updated" | "approval_required" | "failed" | "pending";\n',
              '  parentMissionId?: string;\n  artifactKind?: "task_draft" | "song_document";\n  content?: string;\n  managerOutputId?: string;\n  musicItemId?: string;\n  documentType?: string;\n  readiness?: "ready" | "needs_review" | "save_failed";\n  missingInputs?: string[];\n  status?: "created" | "updated" | "approval_required" | "failed" | "pending";\n',
          )

          # Artifact tool selection: EPK/press kit is a document, never an implicit share package.
          replace(
              "supabase/functions/_shared/manager-conversation/agentLoop.ts",
              '    description: "Create or version one premium canonical song artifact in Files. Before any recipient-facing campaign artifact, establish one internal Release Narrative by calling this tool with documentType press_angle and title exactly Release narrative; use the release-narrative section set described in the body schema. The body MUST be the JSON-encoded structured artifact described by the schema; the server renders recipient-ready copy and applies type-specific quality gates. If the tool rejects quality, repair the named blockers and retry. Never send or publish the document.",',
              '    description: "Create or version one premium canonical song artifact in Files. Before recipient-facing campaign artifacts, you may establish the internal Release Narrative with documentType press_angle and title exactly Release narrative, but it is internal scaffolding and must not be presented as a requested deliverable unless the user explicitly asked for it. The body MUST be the JSON-encoded structured artifact described by the schema. Unknown nonessential facts belong in missingInputs and must not prevent a useful draft; never invent placeholders. If quality gates reject unsupported or unusable copy, repair those blockers and retry. Never send or publish the document.",',
          )
          replace(
              "supabase/functions/_shared/manager-conversation/agentLoop.ts",
              '  const directDocumentIntent = /\\b(draft|write|prepare|create|make|build|revise|refresh|update|finish|complete)\\b/.test(body)',
              '  const directDocumentIntent = /\\b(draft|write|prepare|create|make|build|revise|refresh|update|finish|complete|retry|save)\\b/.test(body)',
          )
          replace(
              "supabase/functions/_shared/manager-conversation/agentLoop.ts",
              '  const packageIntent = /\\b(prepare|build|create|make|assemble)\\b/.test(body)\n  && /\\b(package|share link|private link|delivery link|press kit|epk package)\\b/.test(body);',
              '  const packageIntent = /\\b(prepare|build|create|make|assemble)\\b/.test(body)\n    && /\\b(share package|private package|delivery package|share link|private link|delivery link|export package)\\b/.test(body);',
          )
          marker = 'export function selectManagerConversationToolsForTurn(input: {'
          text = read("supabase/functions/_shared/manager-conversation/agentLoop.ts")
          if 'export function managerConversationExplicitlyRequestsDecisionPackage' not in text:
              insertion = '''export function managerConversationExplicitlyRequestsDecisionPackage(input: {\n  body: string;\n  contextAnswers?: Array<{ questionKey: string; answer: string }>;\n}) {\n  const text = `${input.body} ${(input.contextAnswers ?? []).map((answer) => `${answer.questionKey} ${answer.answer}`).join(" ")}`\n    .replace(/[_-]+/g, " ")\n    .toLowerCase();\n  return /\\bdecision package\\b/.test(text);\n}\n\n'''
              if marker not in text:
                  raise SystemExit("agentLoop: insertion marker missing")
              write("supabase/functions/_shared/manager-conversation/agentLoop.ts", text.replace(marker, insertion + marker, 1))

          # Structured document preparation is exported so persistence failures can preserve the generated draft.
          draft_path = "supabase/functions/_shared/songDocumentDraft.ts"
          replace(
              draft_path,
              '  schemaVersion?: "song_document_v2";\n};\n',
              '  schemaVersion?: "song_document_v2";\n  missingInputs?: string[];\n};\n\nexport type PreparedFocusedSongDocument = {\n  documentType: PremiumSongDocumentType;\n  artifactType: PremiumSongDocumentType;\n  title: string;\n  structure: StructuredSongDocument;\n  quality: SongDocumentQuality;\n  renderedBody: string;\n};\n\nexport function prepareFocusedSongDocumentDraft(\n  inputDocumentType: string | undefined,\n  inputTitle: string | undefined,\n  responseBody: string,\n  requestBody = "",\n): PreparedFocusedSongDocument | null {\n  const request = requestBody.toLowerCase();\n  const documentType = normalizeDocumentType(inputDocumentType) ?? requestedDocumentType(request);\n  if (!documentType || !isPremiumSongDocumentType(documentType)) return null;\n  const title = cleanLongText(inputTitle, 240) || documentTitle(documentType);\n  const artifactType: PremiumSongDocumentType = isReleaseNarrativeTransport(documentType, title)\n    ? "release_narrative"\n    : documentType;\n  const structure = parseStructuredToolBody(responseBody);\n  if (!structure) {\n    throw new Error("Document quality gate failed: body must be the structured JSON artifact, not markdown or conversational prose.");\n  }\n  const quality = assessStructuredSongDocument(artifactType, structure);\n  if (quality.blockers.length) {\n    throw new Error(`Document quality gate failed (${quality.score}/100): ${quality.blockers.join(" ")}`);\n  }\n  return {\n    documentType,\n    artifactType,\n    title,\n    structure,\n    quality,\n    renderedBody: renderStructuredSongDocument(artifactType, title, structure),\n  };\n}\n',
          )
          sub(
              draft_path,
              r'  const request = input\.body\.toLowerCase\(\);\n  const documentType = normalizeDocumentType\(input\.documentType\) \?\? requestedDocumentType\(request\);\n  if \(!documentType \|\| !isPremiumSongDocumentType\(documentType\)\) return;\n\n  const musicItemId = input\.musicSubject\.id;\n  const title = cleanLongText\(input\.title, 240\) \|\| documentTitle\(documentType\);\n  const artifactType: PremiumSongDocumentType = isReleaseNarrativeTransport\(documentType, title\)\n    \? "release_narrative"\n    : documentType;\n  const structure = parseStructuredToolBody\(responseBody\);\n  if \(!structure\) \{\n    throw new Error\("Document quality gate failed: body must be the structured JSON artifact, not markdown or conversational prose\."\);\n  \}\n  const quality = assessStructuredSongDocument\(artifactType, structure\);\n  if \(quality\.blockers\.length\) \{\n    throw new Error\(`Document quality gate failed \(\$\{quality\.score\}/100\): \$\{quality\.blockers\.join\(" "\)\}`\);\n  \}\n  const renderedBody = renderStructuredSongDocument\(artifactType, title, structure\);',
              '  const prepared = prepareFocusedSongDocumentDraft(input.documentType, input.title, responseBody, input.body);\n  if (!prepared) return;\n  const { documentType, artifactType, title, structure, quality, renderedBody } = prepared;\n  const musicItemId = input.musicSubject.id;',
          )
          replace_all(
              draft_path,
              '      schemaVersion: "song_document_v2",\n    };',
              '      schemaVersion: "song_document_v2",\n      missingInputs: structure.missingInputs,\n    };',
              minimum=2,
          )

          # Document persistence failures preserve the generated artifact instead of becoming release-review failures.
          tool_path = "supabase/functions/_shared/manager-conversation/toolExecutor.ts"
          replace(
              tool_path,
              'import { persistFocusedSongDocumentDraft } from "../songDocumentDraft.ts";',
              'import { persistFocusedSongDocumentDraft, prepareFocusedSongDocumentDraft } from "../songDocumentDraft.ts";',
          )
          new_create_document = r'''async function createFocusedSongDocument(db: SupabaseLike, input: ManagerToolInput, args: Record<string, unknown>) {
  const subject = requireFocusedMusicSubject(input);
  if (subject.type !== "music_item") {
    return { status: "not_allowed", reason: "Song documents are currently scoped to an attached song." };
  }
  const documentType = requiredSongDocumentType(args.documentType);
  const title = requiredText(args.title, "Document title", 240);
  const body = requiredText(args.body, "Document body", 60_000);
  const prepared = prepareFocusedSongDocumentDraft(documentType, title, body);
  if (!prepared) throw new Error("Song document type is not supported by the premium document pathway.");

  let persisted: Awaited<ReturnType<typeof persistFocusedSongDocumentDraft>>;
  try {
    persisted = await persistFocusedSongDocumentDraft(
      db,
      { ...input, body: `Create a draft ${documentType} titled ${title}.`, documentType, title },
      input.runId ?? `manager-document-${subject.id}`,
      body,
      false,
    );
  } catch (error) {
    const errorEventId = await captureAppError(error, {
      functionName: "manager-conversation-tool-executor",
      operation: "song_document_persistence",
      source: "database",
      publicMessage: "The draft was created, but it could not be saved to Files.",
      accountId: input.accountId,
      artistWorkspaceId: input.artistWorkspaceId,
      artistId: input.artistId,
      refs: {
        conversation_id: input.conversationId,
        manager_run_id: input.runId,
        music_item_id: subject.id,
        stage: "document_persistence",
      },
    });
    return {
      status: "draft_ready_unsaved",
      musicItemId: subject.id,
      documentType: prepared.artifactType,
      title: prepared.title,
      draftBody: prepared.renderedBody,
      missingInputs: prepared.structure.missingInputs,
      quality: prepared.quality,
      failure: {
        stage: "document_persistence",
        message: "Draft created, but it couldn't be saved to Files.",
        retryable: true,
        ...(errorEventId ? { reference: errorEventId } : {}),
      },
    };
  }

  if (!persisted?.documentId) throw new Error("Song document persistence returned no document receipt.");
  const opportunityId = stringArg(args.opportunityId);
  let linkWarning: Record<string, unknown> | undefined;
  if (opportunityId && ["playlist_pitch", "press_pitch", "press_target_brief", "spotify_editorial_pitch"].includes(documentType)) {
    try {
      const { data: opportunity, error: opportunityError } = await scopedUpdate(db, "release_opportunities", {
        pitch_document_id: persisted.documentId,
      }, input)
        .eq("id", opportunityId)
        .eq("music_item_id", subject.id)
        .select("id")
        .maybeSingle();
      if (opportunityError) throw opportunityError;
      if (!opportunity?.id) throw new Error("The release opportunity could not be linked to its pitch document.");
    } catch (error) {
      const reference = await captureAppError(error, {
        functionName: "manager-conversation-tool-executor",
        operation: "song_document_opportunity_link",
        source: "database",
        publicMessage: "The draft was saved, but its target link needs a retry.",
        accountId: input.accountId,
        artistWorkspaceId: input.artistWorkspaceId,
        artistId: input.artistId,
        refs: {
          conversation_id: input.conversationId,
          manager_run_id: input.runId,
          music_item_id: subject.id,
          stage: "document_target_link",
        },
      });
      linkWarning = {
        message: "Draft saved to Files, but its playlist/press target link could not be updated.",
        retryable: true,
        ...(reference ? { reference } : {}),
      };
    }
  }

  return {
    ...persisted,
    status: "drafted",
    musicItemId: subject.id,
    documentType: prepared.artifactType,
    title: prepared.title,
    missingInputs: prepared.structure.missingInputs,
    quality: prepared.quality,
    ...(opportunityId ? { opportunityId } : {}),
    ...(linkWarning ? { linkWarning } : {}),
  };
}

async function prepareFocusedReleaseSharePackage'''
          sub(
              tool_path,
              r'async function createFocusedSongDocument\(db: SupabaseLike, input: ManagerToolInput, args: Record<string, unknown>\) \{.*?\n\}\n\nasync function prepareFocusedReleaseSharePackage',
              new_create_document,
          )

          # Shared mapping: a document is a document, not a fake music-item receipt.
          work_path = Path("supabase/functions/_shared/manager-conversation/documentWork.ts")
          work_path.write_text(r'''import type { ManagerConversationCreatedWork } from "../openaiManagerConversation.ts";

export type ManagerToolResult = { tool: string; result: unknown };

export function isReleaseSuccessArtifactTool(tool: string) {
  return tool === "read_focused_release_success" || tool === "propose_focused_release_date_change";
}

export function songDocumentWorkFromToolResult(
  musicItemId: string,
  resultValue: unknown,
): ManagerConversationCreatedWork | undefined {
  if (!musicItemId || !isRecord(resultValue)) return undefined;
  const status = text(resultValue.status);
  if (status !== "drafted" && status !== "draft_ready_unsaved") return undefined;
  const documentType = text(resultValue.documentType);
  const title = text(resultValue.title) || "Song document";
  if (documentType === "release_narrative" || title.toLowerCase() === "release narrative") return undefined;

  const quality = isRecord(resultValue.quality) ? resultValue.quality : {};
  const qualityReadiness = text(quality.readiness);
  const missingInputs = Array.isArray(resultValue.missingInputs)
    ? resultValue.missingInputs.map(text).filter(Boolean).slice(0, 20)
    : [];
  const unsaved = status === "draft_ready_unsaved";
  const documentId = text(resultValue.documentId);
  const stableId = documentId || `unsaved-document:${slug(documentType || title)}:${slug(title)}`;

  return {
    type: "music_item",
    id: stableId,
    musicItemId,
    artifactKind: "song_document",
    documentType: documentType || undefined,
    title,
    body: unsaved ? "Draft created, but it couldn't be saved to Files." : "Saved to Files.",
    content: unsaved ? text(resultValue.draftBody) || undefined : undefined,
    readiness: unsaved ? "save_failed" : qualityReadiness === "ready" && !missingInputs.length ? "ready" : "needs_review",
    missingInputs,
    status: unsaved ? "failed" : resultValue.created === false ? "updated" : "created",
  };
}

export function songDocumentWorkItems(
  musicItemId: string,
  results: ManagerToolResult[],
) {
  return results
    .filter((item) => item.tool === "create_focused_song_document")
    .map((item) => songDocumentWorkFromToolResult(musicItemId, item.result))
    .filter((item): item is ManagerConversationCreatedWork => Boolean(item));
}

export function upsertManagerCreatedWork(
  current: ManagerConversationCreatedWork[],
  next: ManagerConversationCreatedWork,
) {
  const key = workKey(next);
  return [...current.filter((item) => workKey(item) !== key), next];
}

function workKey(item: ManagerConversationCreatedWork) {
  return `${item.artifactKind ?? item.type}:${item.id || item.title}`;
}

function isRecord(value: unknown): value is Record<string, unknown> {
  return Boolean(value && typeof value === "object" && !Array.isArray(value));
}

function text(value: unknown) {
  return typeof value === "string" ? value.trim() : "";
}

function slug(value: string) {
  return value.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 72) || "document";
}
''')

          # Non-stream Manager: collect every document tool result, produce user-facing document work,
          # and only persist a decision package when it was explicitly requested.
