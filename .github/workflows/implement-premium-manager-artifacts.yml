              'async function persistDecisionPackageOutput(db: any, input: ManagerConversationInput, conversationId: string, runId: string, output: ManagerConversationOutput) {\n  if (output.actionPolicy !== "create_decision_package") return null;',
              'async function persistDecisionPackageOutput(db: any, input: ManagerConversationInput, conversationId: string, runId: string, output: ManagerConversationOutput) {\n  if (output.actionPolicy !== "create_decision_package" || !managerConversationExplicitlyRequestsDecisionPackage(input)) return null;',
          )
          replace(
              normal_path,
              '      artifactKind: item.artifactKind === "task_draft" ? "task_draft" : undefined,\n      content: item.content ? String(item.content) : undefined,\n      managerOutputId: item.managerOutputId ? String(item.managerOutputId) : undefined,',
              '      artifactKind: item.artifactKind === "task_draft" || item.artifactKind === "song_document" ? item.artifactKind : undefined,\n      content: item.content ? String(item.content) : undefined,\n      managerOutputId: item.managerOutputId ? String(item.managerOutputId) : undefined,\n      musicItemId: item.musicItemId ? String(item.musicItemId) : undefined,\n      documentType: item.documentType ? String(item.documentType) : undefined,\n      readiness: item.readiness === "ready" || item.readiness === "needs_review" || item.readiness === "save_failed" ? item.readiness : undefined,\n      missingInputs: Array.isArray(item.missingInputs) ? item.missingInputs.map((entry: unknown) => String(entry || "").trim()).filter(Boolean).slice(0, 20) : [],',
          )

          # Stream Manager: document tool is not a release-success tool, preserve all documents,
