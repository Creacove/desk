name: Implement premium Manager artifacts

on:
  push:
    branches:
      - agent/premium-manager-artifact-experience
    paths:
      - .github/workflows/implement-premium-manager-artifacts.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: agent/premium-manager-artifact-experience

      - name: Apply product and backend fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/implement-premium-manager-artifacts.py')
          text = path.read_text()
          text = text.replace(
              'next_text, n = re.subn(pattern, replacement, text, count=count, flags=flags)',
              'next_text, n = re.subn(pattern, lambda _match: replacement, text, count=count, flags=flags)',
          )
          path.write_text(text)
          PY
          python scripts/implement-premium-manager-artifacts.py

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make Manager artifacts lifecycle-aware and resilient'
          git push origin HEAD:agent/premium-manager-artifact-experience

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused regression tests
        run: >-
          npx vitest run --environment jsdom --pool=vmThreads
          src/features/manager/managerPresentation.test.ts
          src/features/manager/managerArtifactExperience.test.ts
          src/record-servicing-tool-selection.test.ts
          src/manager-artifact-resilience.test.ts
          src/song-document-persistence-v2.test.ts
          src/song-document-quality-gate.test.ts
          src/song-document-standards.test.ts

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Manager Edge boundaries
        run: >-
          deno check
          supabase/functions/_shared/songDocumentStandards.ts
          supabase/functions/_shared/songDocumentDraft.ts
          supabase/functions/_shared/manager-conversation/documentWork.ts
          supabase/functions/_shared/manager-conversation/agentLoop.ts
          supabase/functions/_shared/manager-conversation/toolExecutor.ts
          supabase/functions/manager-conversation/index.ts
          supabase/functions/manager-conversation-stream/index.ts

      - name: Build production app
        run: npm run build
