              '    executeTool: async (name, args) => {\n      const toolResult = await executeManagerConversationTool(db, toolInput, name, args);\n      if (name === "create_focused_song_document") documentToolResults.push({ tool: name, result: toolResult });\n      return toolResult;\n    },',
          )
          replace(
