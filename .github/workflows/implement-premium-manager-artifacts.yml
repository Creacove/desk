              'async function persistDecisionPackageOutput(db: any, input: ManagerConversationInput, conversationId: string, runId: string, output: ManagerConversationOutput) {\n  if (output.actionPolicy !== "create_decision_package" || !managerConversationExplicitlyRequestsDecisionPackage(input)) return null;',
