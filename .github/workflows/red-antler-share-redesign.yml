name: Red Antler share redesign
on:
  push:
    paths:
      - scripts/red_antler_share_redesign.py
      - .github/workflows/red-antler-share-redesign.yml
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply recipient-first share redesign
        run: python3 scripts/red_antler_share_redesign.py
      - run: npm ci
      - name: Share-focused tests
        run: npx vitest run src/music-share-package.test.ts src/music-share-dialog.test.tsx src/public-music-share-service.test.ts src/music-share-recipient-contract.test.ts src/public-music-share-portal.test.tsx src/music-share-backend-safety.test.ts src/music-share-links-functions.test.ts --environment jsdom --pool=vmThreads
      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Commit redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/music/MusicShareDialog.tsx src/features/music/musicSharePackage.ts src/music-share-dialog.test.tsx src/music-share-package.test.ts
          git commit -m 'feat: redesign share flow around recipient intent'
          git push origin main
