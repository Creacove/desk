name: Inspect Manager wire type seams

on:
  push:
    branches:
      - fix/manager-turn-contract

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show exact browser wire seams
        run: |
          set -euo pipefail
          echo '--- imports ---'
          sed -n '1,100p' src/services/productionSupabase.ts
          echo '--- presentation parser refs ---'
          grep -n -C 18 -E 'normalizeManagerTurnPresentation|latestManagerPresentation|visibleDecisionPackage' src/services/productionSupabase.ts || true
          echo '--- created work normalizer ---'
          grep -n -C 24 -E '^function normalizeCreatedWork|presentationRole|visibility' src/services/productionSupabase.ts || true
          echo '--- conversation row mapper ---'
          grep -n -C 30 -E '^function conversationMessageFromRow|presentation = normalizeManagerTurnPresentation' src/services/productionSupabase.ts || true
