name: Fix Manager turn contract browser types

on:
  push:
    branches:
      - fix/manager-turn-contract

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/manager-turn-contract
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Keep wire metadata out of broad browser domain types
        run: |
          git checkout origin/main -- src/types/cleanProduction.ts
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          path = Path('src/features/manager/ManagerScreens.tsx')
          text = path.read_text()
          text = replace_once(
              text,
              'type CreatedWork = NonNullable<ConversationMessageViewModel["createdWork"]>[number];',
              'type CreatedWork = NonNullable<ConversationMessageViewModel["createdWork"]>[number];\ntype TurnPresentation = { version: 1; surfaces: Array<"release_success" | "release_opportunities" | "decision_package" | "release_share_package">; visibleArtifactIds: string[]; decisionPackageId?: string };\ntype PresentationCreatedWork = CreatedWork & { presentationRole?: "deliverable" | "internal_support" | "compatibility"; visibility?: "user" | "internal" };',
              'Manager local presentation types',
          )
          text = replace_once(
              text,
              '  const latestManagerPresentation = lastManagerIndex >= 0 ? messages[lastManagerIndex]?.presentation : undefined;',
              '  const latestManagerPresentation = lastManagerIndex >= 0\n    ? (messages[lastManagerIndex] as (ConversationMessageViewModel & { presentation?: TurnPresentation }) | undefined)?.presentation\n    : undefined;',
              'Manager local presentation read',
          )
          text = replace_once(
              text,
              '    const createdWork = (message.createdWork ?? []).flatMap((item) => {\n      if (item.visibility === "internal" || item.presentationRole === "internal_support" || item.presentationRole === "compatibility") return [];\n      const normalized = normalizeHistoricalDocumentWork(item, message.id, subject);',
              '    const createdWork = (message.createdWork ?? []).flatMap((item) => {\n      const presentationItem = item as PresentationCreatedWork;\n      if (presentationItem.visibility === "internal" || presentationItem.presentationRole === "internal_support" || presentationItem.presentationRole === "compatibility") return [];\n      const normalized = normalizeHistoricalDocumentWork(item, message.id, subject);',
              'Manager local created-work metadata',
          )
          path.write_text(text)

          path = Path('src/features/manager/managerPresentation.ts')
          text = path.read_text()
          text = replace_once(
              text,
              '  const unique = dedupeManagerWork(items.filter((item) =>\n    item.visibility !== "internal"\n    && item.presentationRole !== "internal_support"\n    && item.presentationRole !== "compatibility"\n    && item.documentType !== "release_narrative"\n    && item.title.trim().toLowerCase() !== "release narrative"\n  ));',
              '  const unique = dedupeManagerWork(items.filter((item) => {\n    const presentationItem = item as ManagerWorkItem & { presentationRole?: "deliverable" | "internal_support" | "compatibility"; visibility?: "user" | "internal" };\n    return presentationItem.visibility !== "internal"\n      && presentationItem.presentationRole !== "internal_support"\n      && presentationItem.presentationRole !== "compatibility"\n      && item.documentType !== "release_narrative"\n      && item.title.trim().toLowerCase() !== "release narrative";\n  }));',
              'presentation grouping local metadata',
          )
          path.write_text(text)

          path = Path('src/services/productionSupabase.ts')
          text = path.read_text()
          text = replace_once(
              text,
              'function normalizeManagerTurnPresentation(value: unknown): ConversationMessageViewModel["presentation"] {',
              'type ManagerTurnPresentationWire = { version: 1; surfaces: Array<"release_success" | "release_opportunities" | "decision_package" | "release_share_package">; visibleArtifactIds: string[]; decisionPackageId?: string };\n\nfunction normalizeManagerTurnPresentation(value: unknown): ManagerTurnPresentationWire | undefined {',
              'production local presentation type',
          )
          text = replace_once(
              text,
              '  const surfaces = [...new Set(value.surfaces.filter((item): item is string => typeof item === "string" && allowed.has(item)))] as NonNullable<ConversationMessageViewModel["presentation"]>["surfaces"];',
              '  const surfaces = [...new Set(value.surfaces.filter((item): item is string => typeof item === "string" && allowed.has(item)))] as ManagerTurnPresentationWire["surfaces"];',
              'production local surface type',
          )
          path.write_text(text)

          path = Path('src/manager-turn-contract.test.ts')
          text = path.read_text()
          text = text.replace('    conversation.messages = [\n', '    conversation.messages = [\n')
          text = text.replace('    ];\n    expect(prepareManagerConversationForPresentation(conversation).releaseOpportunityArtifacts)', '    ] as any;\n    expect(prepareManagerConversationForPresentation(conversation).releaseOpportunityArtifacts)', 1)
          text = text.replace('    ];\n    const projected = prepareManagerConversationForPresentation(conversation);', '    ] as any;\n    const projected = prepareManagerConversationForPresentation(conversation);', 1)
          text = text.replace('    ];\n    expect(prepareManagerConversationForPresentation(conversation).decisionPackage?.id)', '    ] as any;\n    expect(prepareManagerConversationForPresentation(conversation).decisionPackage?.id)', 1)
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Test focused Manager contracts
        run: npx vitest run --environment jsdom --pool=vmThreads src/manager-turn-contract.test.ts src/features/manager/managerArtifactExperience.test.ts src/manager-document-navigation-contract.test.ts
      - name: Build production frontend
        run: npm run build
      - name: Commit browser type-safe contract
        run: |
          git rm .github/workflows/fix-manager-turn-contract-types.yml
          git add src/types/cleanProduction.ts src/features/manager/ManagerScreens.tsx src/features/manager/managerPresentation.ts src/services/productionSupabase.ts src/manager-turn-contract.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: keep Manager turn metadata wire-scoped"
          git push origin HEAD:fix/manager-turn-contract
