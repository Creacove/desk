name: Inspect Manager turn contract

on:
  push:
    branches:
      - fix/manager-turn-contract

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inspect Manager persistence and presentation seams
        shell: bash
        run: |
          set -euo pipefail
          show() {
            local file="$1"
            local pattern="$2"
            echo "===== $file :: $pattern ====="
            grep -n -C 12 -E "$pattern" "$file" || true
          }
          show supabase/functions/manager-conversation/index.ts 'create_decision_package|actionPolicy|decisionPackage|createdWork|conversation_messages'
          show supabase/functions/manager-conversation-stream/index.ts 'create_decision_package|actionPolicy|decisionPackage|createdWork|conversation_messages'
          show supabase/functions/_shared/manager-conversation/toolExecutor.ts 'create_focused_song_document|createdWork|artifactKind|Release narrative|release_narrative'
          show supabase/functions/_shared/openaiManagerConversationLegacy.ts 'actionPolicy|create_decision_package|createdWork|decision package'
          show src/services/productionSupabase.ts 'createdWork|decisionPackage|conversation_messages|releaseSuccessArtifacts|releaseOpportunityArtifacts'
          show src/features/manager/ManagerScreens.tsx 'decisionPackage|releaseSuccess|opportunity|latest|playlist|regex|RegExp'
          show src/features/manager/ManagerScreensLegacy.tsx 'decisionPackage|releaseSuccess|opportunityArtifacts|visibleWork|release_narrative'
          show src/features/manager/managerPresentation.ts 'createdWork|release_narrative|song_document|compat'
          show src/types/cleanProduction.ts 'ConversationMessageViewModel|createdWork|DecisionPackageViewModel'
