name: Mission premerge one-shot patch

on:
  push:
    branches: [design/mission-workspace-simplification]
    paths:
      - .github/workflows/mission-premerge-avatar-patch.yml

permissions:
  contents: write

jobs:
  patch-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: design/mission-workspace-simplification
          fetch-depth: 0

      - name: Wire hydrated Spotify avatar into mobile chrome
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/app/ProductionApp.tsx')
          source = path.read_text()
          old = '''            onNavigate={navigateFromMenu}\n            showTopbar={showMobileTopbar}\n            showTabbar={showMobileTabbar}\n'''
          new = '''            onNavigate={navigateFromMenu}\n            avatarUrl={profile.imageUrl ?? workspace?.spotifyImageUrl}\n            showTopbar={showMobileTopbar}\n            showTabbar={showMobileTabbar}\n'''
          if old not in source:
              raise SystemExit('MobileChrome call contract changed; refusing blind patch')
          path.write_text(source.replace(old, new, 1))

      - name: Remove one-shot workflow and commit patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/mission-premerge-avatar-patch.yml
          git add src/app/ProductionApp.tsx
          git config user.name "ordersounds-premerge-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: show Spotify artist avatar in mobile header"
          git push origin HEAD:design/mission-workspace-simplification

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full repository tests
        run: npm test

      - name: Check browser TypeScript
        run: npx tsc --noEmit --pretty false
