name: Align document save regression label

on:
  push:
    branches:
      - fix/label-grade-documents
    paths:
      - .github/workflows/fix-label-grade-save-test.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/label-grade-documents
      - name: Align test with minimal editor copy
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/production-app-shell.test.tsx')
          text = path.read_text()
          old = 'fireEvent.click(screen.getByRole("button", { name: "Save revision" }));'
          new = 'fireEvent.click(screen.getByRole("button", { name: "Save" }));'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one old save-label assertion, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit test alignment
        run: |
          git rm .github/workflows/fix-label-grade-save-test.yml
          git add src/production-app-shell.test.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: align document save action with simplified editor"
          git push origin HEAD:fix/label-grade-documents
