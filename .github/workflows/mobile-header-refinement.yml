name: Mobile header refinement

on:
  push:
    branches:
      - design/mobile-header-refinement
    paths:
      - .github/workflows/mobile-header-refinement.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/mobile-header-refinement.yml

permissions:
  contents: write

jobs:
  refine-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/mobile-header-refinement
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply header and Home cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new))

          components = "src/design-system/components.tsx"
          replace_exact(
              components,
              'import { ArrowLeft, Bell, ClipboardCheck, House, Library, LogOut, MessageCircle, Settings } from "lucide-react";',
              'import { ArrowLeft, Bell, ClipboardCheck, House, Library, LogOut, MessageCircle, UserRound } from "lucide-react";',
          )
          replace_exact(
              components,
              'className="sticky top-0 z-40 -mx-3 mb-3 flex items-center justify-between border-b border-foreground/8 bg-background/94 px-3 py-3 backdrop-blur-xl lg:hidden"',
              'className="sticky top-0 z-40 -mx-3 mb-3 flex min-h-[64px] items-center justify-between border-b border-foreground/8 bg-background/94 px-3 py-2.5 backdrop-blur-xl lg:hidden"',
          )
          replace_exact(
              components,
              '''          <div className="flex min-w-0 items-center gap-2.5">
            <BrandMark size="sm" className="h-8 w-8 rounded-[9px]" />
            <div className="min-w-0">
              <p className="truncate text-[14px] font-semibold tracking-[-0.015em] text-foreground">{title}</p>
              <p className="mt-0.5 truncate text-[9px] font-semibold uppercase tracking-[0.08em] text-muted-foreground/62">Ordersounds</p>
            </div>
          </div>''',
              '''          <div className="min-w-0">
            <p className="font-ui truncate text-[9px] font-semibold uppercase tracking-[0.12em] text-muted-foreground/62">
              {active === "settings" ? "Account" : "Artist workspace"}
            </p>
            <h1 className="font-display mt-1 truncate text-[19px] font-semibold leading-none tracking-[-0.025em] text-foreground">{title}</h1>
          </div>''',
          )
          replace_exact(components, '<div className="flex shrink-0 items-center gap-1">', '<div className="flex shrink-0 items-center gap-1.5">')
          replace_exact(
              components,
              '''            <button
              type="button"
              aria-label="Open settings"
              onClick={() => onNavigate("artistProfileWorkspace")}
              className={cn(
                "flex h-9 w-9 items-center justify-center rounded-full text-muted-foreground transition-colors hover:bg-foreground/[0.05] hover:text-foreground",
                active === "settings" && "bg-foreground/[0.06] text-foreground",
              )}
            >
              <Settings className={cn("h-4 w-4", active === "settings" && "text-brand-accent")} aria-hidden="true" />
            </button>''',
              '''            <button
              type="button"
              data-testid="mobile-account-trigger"
              aria-label="Open artist settings"
              onClick={() => onNavigate("artistProfileWorkspace")}
              className={cn(
                "flex h-9 w-9 items-center justify-center rounded-full border border-foreground/8 bg-foreground/[0.02] text-muted-foreground transition-colors hover:border-foreground/14 hover:bg-foreground/[0.05] hover:text-foreground",
                active === "settings" && "border-brand-accent/25 bg-brand-accent/[0.06] text-brand-accent",
              )}
            >
              <UserRound className="h-[16px] w-[16px]" aria-hidden="true" />
            </button>''',
          )
          replace_exact(components, 'const label = item.active === "labelHQ" ? "HQ" : item.label;', 'const label = item.label;')

          replace_exact(
              "src/app/ProductionApp.tsx",
              'activeSection === "labelHQ" ? "Desk HQ" :',
              'activeSection === "labelHQ" ? "Home" :',
          )

          home = "src/features/desk/DeskHQ.tsx"
          replace_exact(
              home,
              '''      <MobileDeskHome
        profile={profile}
        brief={brief}
        error={todayBriefError}
        lead={focusLead}
        missions={missions}
        onNavigate={onNavigate}
        onOpenMission={onOpenMission}
        onDrawer={onDrawer}
        onAskManager={onAskManager}
        activityCount={visibleActivityCount}
        onOpenActivityCenter={onOpenActivityCenter ?? (() => undefined)}
      />''',
              '''      <MobileDeskHome
        profile={profile}
        brief={brief}
        error={todayBriefError}
        lead={focusLead}
        missions={missions}
        onNavigate={onNavigate}
        onOpenMission={onOpenMission}
        onDrawer={onDrawer}
        onAskManager={onAskManager}
      />''',
          )
          replace_exact(
              home,
              '''            <DeskCommandBrief
              profile={profile}
              brief={brief}
              error={todayBriefError}
              onDrawer={onDrawer}
            />''',
              '''            <DeskCommandBrief
              profile={profile}
              brief={brief}
              error={todayBriefError}
            />''',
          )
          replace_exact(
              home,
              '''function DeskCommandBrief({
  profile,
  brief,
  error,
  onDrawer,
}: {
  profile: ArtistProfileViewModel;
  brief: TodayBriefViewModel;
  error: string | null;
  onDrawer: (drawer: DrawerKind) => void;
}) {''',
              '''function DeskCommandBrief({
  profile,
  brief,
  error,
}: {
  profile: ArtistProfileViewModel;
  brief: TodayBriefViewModel;
  error: string | null;
}) {''',
          )
          replace_exact(
              home,
              '''      <div className="mt-4 flex flex-wrap items-center gap-x-5 gap-y-2">
        <button type="button" className="text-[12px] font-semibold text-muted-foreground transition-colors hover:text-foreground" onClick={() => onDrawer("evidence")}>
          View evidence
        </button>
        <span className="text-[10px] font-semibold uppercase tracking-[0.08em] text-muted-foreground/58">Prepared {formatBriefGeneratedAt(brief.generatedAt)}</span>
      </div>''',
              '''      <p className="mt-4 text-[10px] font-semibold uppercase tracking-[0.08em] text-muted-foreground/58">Prepared {formatBriefGeneratedAt(brief.generatedAt)}</p>''',
          )
          replace_exact(
              home,
              '''  onDrawer,
  onAskManager,
  activityCount,
  onOpenActivityCenter,
}: {''',
              '''  onDrawer,
  onAskManager,
}: {''',
          )
          replace_exact(
              home,
              '''  onDrawer: (drawer: DrawerKind) => void;
  onAskManager: (body: string) => void;
  activityCount: number;
  onOpenActivityCenter: () => void;
}) {''',
              '''  onDrawer: (drawer: DrawerKind) => void;
  onAskManager: (body: string) => void;
}) {''',
          )
          replace_exact(
              home,
              '''      <header className="flex items-center justify-between border-b border-foreground/8 pb-3">
        <div>
          <p className="font-ui text-[9px] font-semibold uppercase tracking-[0.12em] text-muted-foreground/65">Artist workspace</p>
          <h1 className="mt-1 font-display text-[25px] font-semibold leading-none tracking-[-0.035em] text-foreground">Home</h1>
        </div>
        <button
          type="button"
          aria-label={activityCount ? `Open Activity Center, ${activityCount} unread` : "Open Activity Center"}
          onClick={onOpenActivityCenter}
          className="relative flex h-9 w-9 items-center justify-center rounded-full text-muted-foreground transition-colors hover:bg-foreground/[0.04] hover:text-foreground"
        >
          <Bell className="h-4 w-4" aria-hidden="true" />
          {activityCount ? <span className="absolute -right-0.5 -top-0.5 flex h-4 min-w-4 items-center justify-center rounded-full bg-brand-accent px-1 text-[8px] font-bold text-white ring-2 ring-background">{activityCount > 9 ? "9+" : activityCount}</span> : null}
        </button>
      </header>

''',
              '',
          )
          replace_exact(
              home,
              '''        <button type="button" className="mt-3 text-[11px] font-semibold text-muted-foreground" onClick={() => onDrawer("evidence")}>
          View evidence
        </button>

''',
              '''        <p className="mt-3 text-[9px] font-semibold uppercase tracking-[0.08em] text-muted-foreground/55">Prepared {formatBriefGeneratedAt(brief.generatedAt)}</p>

''',
          )

          editorial = "src/desk-hq-editorial.test.tsx"
          replace_exact(editorial, 'expect(screen.getAllByRole("heading", { name: "Home" })).toHaveLength(2);', 'expect(screen.getAllByRole("heading", { name: "Home" })).toHaveLength(1);')
          replace_exact(editorial, 'expect(screen.getAllByText("Artist workspace")).toHaveLength(2);', 'expect(screen.getAllByText("Artist workspace")).toHaveLength(1);')
          replace_exact(
              editorial,
              '''  it("keeps evidence accessible on desktop and mobile", () => {
    renderHome();

    const desktopBrief = screen.getByTestId("desk-editorial-brief");
    expect(within(desktopBrief).getByRole("button", { name: "View evidence" })).toBeInTheDocument();

    const mobileBrief = screen.getByTestId("desk-mobile-command-surface");
    expect(within(mobileBrief).getByRole("button", { name: "View evidence" })).toBeInTheDocument();
  });''',
              '''  it("keeps the Home brief focused without evidence CTAs", () => {
    renderHome();

    const desktopBrief = screen.getByTestId("desk-editorial-brief");
    expect(within(desktopBrief).queryByRole("button", { name: "View evidence" })).not.toBeInTheDocument();

    const mobileBrief = screen.getByTestId("desk-mobile-command-surface");
    expect(within(mobileBrief).queryByRole("button", { name: "View evidence" })).not.toBeInTheDocument();
  });''',
          )

          shell = "src/production-app-shell.test.tsx"
          replace_exact(shell, 'expect(screen.getByTestId("mobile-tab-label-HQ")).toHaveTextContent("HQ");', 'expect(screen.getByTestId("mobile-tab-label-Home")).toHaveTextContent("Home");')
          replace_exact(shell, '"Open settings"', '"Open artist settings"', expected=2)
          replace_exact(
              shell,
              '''    expect(loadEvidence).not.toHaveBeenCalled();

    fireEvent.click(screen.getAllByRole("button", { name: "View evidence" })[0]);
    await waitFor(() => expect(loadEvidence).toHaveBeenCalledTimes(1));''',
              '''    expect(loadEvidence).not.toHaveBeenCalled();
    expect(screen.queryByRole("button", { name: "View evidence" })).not.toBeInTheDocument();''',
          )
          replace_exact(
              shell,
              'expect(screen.getAllByRole("button", { name: "View evidence" }).length).toBeGreaterThan(0);',
              'expect(screen.queryByRole("button", { name: "View evidence" })).not.toBeInTheDocument();',
          )
          replace_exact(
              shell,
              'expect(screen.getAllByRole("button", { name: /Open Activity Center/i }).length).toBeGreaterThanOrEqual(2);',
              '''expect(within(screen.getByTestId("mobile-app-topbar")).getAllByRole("button", { name: /Open Activity Center/i })).toHaveLength(1);
    expect(within(screen.getByTestId("desk-mobile-home")).queryByRole("button", { name: /Open Activity Center/i })).not.toBeInTheDocument();''',
          )

          print("Header/nav refinement applied")
          PY
      - run: npm ci
      - name: Home editorial contract
        run: npm test -- src/desk-hq-editorial.test.tsx
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Production shell regressions
        run: npm test -- src/production-app-shell.test.tsx
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Full repository suite
        run: npm test
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/design-system/components.tsx src/app/ProductionApp.tsx src/features/desk/DeskHQ.tsx src/desk-hq-editorial.test.tsx src/production-app-shell.test.tsx
          git commit -m "design: unify mobile header and Home chrome"
          git push origin HEAD:design/mobile-header-refinement
