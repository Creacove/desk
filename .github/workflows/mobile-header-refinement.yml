name: Mobile header refinement

on:
  push:
    branches:
      - design/mobile-header-refinement
    paths:
      - scripts/mobile_header_refinement.py
      - .github/workflows/mobile-header-refinement.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/mobile-header-refinement
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply refinement
        run: python3 scripts/mobile_header_refinement.py
      - name: Align surviving Home hover contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/production-app-shell.test.tsx")
          text = path.read_text()
          old = 'expect(source).toContain("hover:bg-foreground/[0.04]");'
          new = 'expect(source).toContain("hover:bg-foreground/[0.045]");'
          if text.count(old) != 1:
              raise SystemExit("Expected one stale Home hover source contract")
          path.write_text(text.replace(old, new))
          PY
      - run: npm ci
      - name: Home editorial contract
        run: npm test -- src/desk-hq-editorial.test.tsx
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Production shell regressions
        run: npm test -- src/production-app-shell.test.tsx
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Full repository suite
        run: npm test
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/design-system/components.tsx src/app/ProductionApp.tsx src/features/desk/DeskHQ.tsx src/desk-hq-editorial.test.tsx src/production-app-shell.test.tsx
          git commit -m "design: unify mobile header and Home chrome"
          git push origin HEAD:design/mobile-header-refinement
