name: Apply Manager document deep link

on:
  push:
    branches:
      - fix/manager-document-deep-link

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: deep-link Manager documents') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manager-document-deep-link
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch exact document navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          # ProductionApp: carry the canonical document id through Manager -> Catalog navigation.
          path = Path("src/app/ProductionApp.tsx")
          text = path.read_text()
          text = replace_once(
              text,
              '  const [targetSongRoomTab, setTargetSongRoomTab] = useState<"overview" | "files">("overview");\n  const [musicRoomOpenRequestKey, setMusicRoomOpenRequestKey] = useState(0);',
              '  const [targetSongRoomTab, setTargetSongRoomTab] = useState<"overview" | "files">("overview");\n  const [targetSongDocumentId, setTargetSongDocumentId] = useState<string | null>(null);\n  const [musicRoomOpenRequestKey, setMusicRoomOpenRequestKey] = useState(0);',
              "ProductionApp target document state",
          )
          text = replace_once(
              text,
              '    if (event.targetType === "music_item" || event.targetType === "music_project") {\n      setTargetSongRoomTab("overview");\n      setTargetMusicObjectId(event.targetId);',
              '    if (event.targetType === "music_item" || event.targetType === "music_project") {\n      setTargetSongRoomTab("overview");\n      setTargetSongDocumentId(null);\n      setTargetMusicObjectId(event.targetId);',
              "ProductionApp workspace-event reset",
          )
          text = replace_once(
              text,
              '    if (nextView === "musicWorkspace") {\n      setTargetSongRoomTab("overview");\n      setTargetMusicObjectId(null);',
              '    if (nextView === "musicWorkspace") {\n      setTargetSongRoomTab("overview");\n      setTargetSongDocumentId(null);\n      setTargetMusicObjectId(null);',
              "ProductionApp menu reset",
          )
          text = replace_once(
              text,
              '  function openMusicFocus(musicObjectId?: string) {\n    setTargetSongRoomTab("overview");\n    setTargetMusicObjectId(musicObjectId ?? null);',
              '  function openMusicFocus(musicObjectId?: string) {\n    setTargetSongRoomTab("overview");\n    setTargetSongDocumentId(null);\n    setTargetMusicObjectId(musicObjectId ?? null);',
              "ProductionApp focus reset",
          )
          text = replace_once(
              text,
              '  async function openCreatedWork(type: "music_item" | "mission" | "task", id?: string, destination?: "files") {\n    if (type === "music_item") {\n      setTargetSongRoomTab(destination === "files" ? "files" : "overview");\n      setTargetMusicObjectId(id ?? null);',
              '  async function openCreatedWork(type: "music_item" | "mission" | "task", id?: string, destination?: "files", artifactId?: string) {\n    if (type === "music_item") {\n      setTargetSongRoomTab(destination === "files" ? "files" : "overview");\n      setTargetSongDocumentId(destination === "files" ? artifactId ?? null : null);\n      setTargetMusicObjectId(id ?? null);',
              "ProductionApp created-work deep link",
          )
          text = replace_once(
              text,
              '              targetSongRoomTab={targetSongRoomTab}\n              targetRequestKey={musicRoomOpenRequestKey}',
              '              targetSongRoomTab={targetSongRoomTab}\n              targetDocumentId={targetSongDocumentId}\n              targetRequestKey={musicRoomOpenRequestKey}',
              "ProductionApp MusicWorkspace document prop",
          )
          path.write_text(text)

          # Manager UI: pass the canonical document id instead of only opening generic Files.
          path = Path("src/features/manager/ManagerScreensLegacy.tsx")
          text = path.read_text()
          signature = 'onOpenCreatedWork: (type: "music_item" | "mission" | "task", id?: string, destination?: CreatedWorkDestination) => void | Promise<void>;'
          signature_next = 'onOpenCreatedWork: (type: "music_item" | "mission" | "task", id?: string, destination?: CreatedWorkDestination, artifactId?: string) => void | Promise<void>;'
          count = text.count(signature)
          if count < 5:
              raise SystemExit(f"Manager callback signatures: expected >=5 matches, found {count}")
          text = text.replace(signature, signature_next)
          text = replace_once(
              text,
              '<ResultAction pendingLabel="Opening Files…" onClick={() => onOpenCreatedWork("music_item", musicItemId, "files")}>\n            {managerDocumentOpenLabel(item.documentType)}',
              '<ResultAction pendingLabel="Opening document…" onClick={() => onOpenCreatedWork("music_item", musicItemId, "files", item.id)}>\n            {managerDocumentOpenLabel(item.documentType)}',
              "Manager document button deep link",
          )
          path.write_text(text)

          # MusicWorkspace: open the exact native document, refreshing the song first if needed.
          path = Path("src/features/music/MusicScreens.tsx")
          text = path.read_text()
          text = replace_once(
              text,
              '  targetMusicObjectId,\n  targetSongRoomTab = "overview",\n  targetRequestKey = 0,',
              '  targetMusicObjectId,\n  targetSongRoomTab = "overview",\n  targetDocumentId,\n  targetRequestKey = 0,',
              "MusicWorkspace document destructure",
          )
          text = replace_once(
              text,
              '  targetMusicObjectId?: string | null;\n  targetSongRoomTab?: SongRoomTab;\n  targetRequestKey?: number;',
              '  targetMusicObjectId?: string | null;\n  targetSongRoomTab?: SongRoomTab;\n  targetDocumentId?: string | null;\n  targetRequestKey?: number;',
              "MusicWorkspace document prop type",
          )
          old_effect = '''  useEffect(() => {\n    if (!targetMusicObjectId) return;\n    const requestKey = `${targetMusicObjectId}:${targetSongRoomTab}:${targetRequestKey}`;\n    if (handledTargetRequest.current === requestKey) return;\n    const target = getMusicObject(targetMusicObjectId);\n    if (!target) return;\n    handledTargetRequest.current = requestKey;\n    openObject(target, target.kind === "project" ? "projects" : "songs", targetSongRoomTab);\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [targetMusicObjectId, targetSongRoomTab, targetRequestKey, music]);'''
          new_effect = '''  useEffect(() => {\n    if (!targetMusicObjectId) return;\n    const requestKey = `${targetMusicObjectId}:${targetSongRoomTab}:${targetDocumentId ?? ""}:${targetRequestKey}`;\n    if (handledTargetRequest.current === requestKey) return;\n    const target = getMusicObject(targetMusicObjectId);\n    if (!target) return;\n    handledTargetRequest.current = requestKey;\n    openObject(target, target.kind === "project" ? "projects" : "songs", targetSongRoomTab);\n\n    if (target.kind !== "song" || targetSongRoomTab !== "files" || !targetDocumentId) return;\n    const localDocument = (target.materials ?? []).find(\n      (material): material is Extract<SongMaterialViewModel, { kind: "document" }> =>\n        material.kind === "document" && material.id === targetDocumentId,\n    );\n    if (localDocument) {\n      setDocumentEditorTarget({ song: target, document: localDocument });\n      return;\n    }\n\n    let cancelled = false;\n    void onRefreshObject(target.id, "music_item")\n      .then((refreshed) => {\n        if (cancelled || !refreshed) return;\n        const document = (refreshed.materials ?? []).find(\n          (material): material is Extract<SongMaterialViewModel, { kind: "document" }> =>\n            material.kind === "document" && material.id === targetDocumentId,\n        );\n        if (document) setDocumentEditorTarget({ song: refreshed, document });\n      })\n      .catch(() => undefined);\n    return () => { cancelled = true; };\n    // The request key is the navigation contract. Object refresh is an intentional fallback.\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [targetMusicObjectId, targetSongRoomTab, targetDocumentId, targetRequestKey, music]);'''
          text = replace_once(text, old_effect, new_effect, "MusicWorkspace exact document effect")
          path.write_text(text)

          # A small source contract guards the entire cross-screen wiring from regressing.
          Path("src/manager-document-navigation-contract.test.ts").write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\ndescribe("Manager canonical document navigation contract", () => {\n  it("carries the saved document id from Manager into the song document editor", () => {\n    const manager = readFileSync("src/features/manager/ManagerScreensLegacy.tsx", "utf8");\n    const app = readFileSync("src/app/ProductionApp.tsx", "utf8");\n    const music = readFileSync("src/features/music/MusicScreens.tsx", "utf8");\n\n    expect(manager).toContain('onOpenCreatedWork("music_item", musicItemId, "files", item.id)');\n    expect(app).toContain("targetSongDocumentId");\n    expect(app).toContain("targetDocumentId={targetSongDocumentId}");\n    expect(app).toContain("artifactId?: string");\n    expect(music).toContain("targetDocumentId?: string | null");\n    expect(music).toContain('material.kind === "document" && material.id === targetDocumentId');\n    expect(music).toContain("setDocumentEditorTarget({ song: refreshed, document })");\n  });\n});\n''')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Test document navigation contract
        run: npx vitest run src/manager-document-navigation-contract.test.ts src/features/manager/managerArtifactExperience.test.ts
      - name: Build production frontend
        run: npm run build
      - name: Commit the validated patch
        run: |
          git rm .github/workflows/apply-manager-document-deeplink.yml
          git add src/app/ProductionApp.tsx src/features/music/MusicScreens.tsx src/features/manager/ManagerScreensLegacy.tsx src/manager-document-navigation-contract.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: deep-link Manager documents to exact Files artifact"
          git push origin HEAD:fix/manager-document-deep-link
