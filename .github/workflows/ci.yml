name: PR Safety

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: http://localhost:54321
  VITE_SUPABASE_ANON_KEY: ci-test-anon-key

jobs:
  type-regression:
    name: Browser type regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head with base history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compare TypeScript diagnostics with main
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"

          git checkout --detach "$BASE_SHA"
          npx tsc --noEmit --pretty false > /tmp/tsc-base.txt 2>&1 || true

          git checkout --detach "$HEAD_SHA"
          npx tsc --noEmit --pretty false > /tmp/tsc-head.txt 2>&1 || true

          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          import sys

          location = re.compile(r'\(\d+,\d+\)')

          def diagnostics(path):
              lines = []
              for raw in Path(path).read_text(errors='replace').splitlines():
                  line = location.sub('(LINE,COL)', raw.strip())
                  # Root tsc is a browser-oriented check. Supabase Edge modules use
                  # explicit .ts specifiers by Deno convention and are checked below
                  # with Deno instead of treating TS5097 as a browser regression.
                  if line.startswith('supabase/functions/') and 'error TS5097:' in line:
                      continue
                  lines.append(line)
              return Counter(lines)

          base = diagnostics('/tmp/tsc-base.txt')
          head = diagnostics('/tmp/tsc-head.txt')
          added = head - base
          removed = base - head

          if added:
              print('New TypeScript diagnostics introduced by this PR:')
              for line, count in sorted(added.items()):
                  for _ in range(count):
                      print(f'  + {line}')
              if removed:
                  print('\nBaseline diagnostics removed or moved:')
                  for line, count in sorted(removed.items()):
                      for _ in range(count):
                          print(f'  - {line}')
              sys.exit(1)

          print('No new browser TypeScript diagnostics were introduced.')
          if removed:
              print(f'The PR removes {sum(removed.values())} baseline diagnostic line(s).')
          PY

  edge-typecheck:
    name: Structured document Deno check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check new Edge helpers
        run: >-
          deno check
          supabase/functions/_shared/songDocumentStandards.ts
          supabase/functions/_shared/songDocumentDraft.ts

  focused-tests:
    name: Record servicing and campaign tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run affected product tests
        run: >-
          npx vitest run --environment jsdom --pool=vmThreads
          src/record-servicing-tool-selection.test.ts
          src/record-servicing-opportunity-ui.test.tsx
          src/release-success-conversation.test.tsx
          src/song-campaign-state.test.ts
          src/song-campaign-ui.test.tsx
          src/song-document-persistence-v2.test.ts
          src/song-document-quality-gate.test.ts
          src/song-document-standards.test.ts
          src/music-share-internal-narrative.test.ts

  compatibility-audit:
    name: Full-suite compatibility audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full suite and reject unexpected failures
        shell: bash
        run: |
          set +e
          NO_COLOR=1 npm test > /tmp/full-suite.log 2>&1
          TEST_STATUS=$?
          set -e

          if [ "$TEST_STATUS" -eq 0 ]; then
            echo "Full repository test suite passed."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          text = Path('/tmp/full-suite.log').read_text(errors='replace')
          ansi = re.compile(r'\x1b\[[0-9;]*m')
          failures = []
          for raw in text.splitlines():
              line = ansi.sub('', raw).strip()
              if line.startswith('FAIL '):
                  failures.append(re.sub(r'^FAIL\s+', '', line).strip())

          known = {
              "src/production-app-shell.test.tsx > Clean production prototype-match shell > keeps the created secure link usable when its optional email delivery fails",
              "src/production-app-shell.test.tsx > Clean production prototype-match shell > keeps selected-asset sharing inside the song Files surface",
              "src/production-app-shell.test.tsx > Clean production prototype-match shell > uses mobile-native song and project room layouts after opening Music items",
              "src/production-app-shell.test.tsx > Clean production prototype-match shell > rebuilds Music as a durable recorded-work area with song/project rooms",
              "src/production-app-shell.test.tsx > Clean production prototype-match shell > keeps real upload progress inside Files instead of blocking the song room",
              "src/production-app-shell.test.tsx > Clean production prototype-match shell > does not replay a consumed song navigation intent after repository refresh",
              "src/production-app-shell.test.tsx > Clean production prototype-match shell > creates a native song document from the Documents section",
              "src/production-app-shell.test.tsx > Clean production prototype-match shell > opens a chat-created song directly on its requested Files destination",
              "src/openai-manager-conversation-function.test.ts > OpenAI Manager Conversation Router > defines the document text normalizer used while loading focused song context",
              "src/manager-agent-loop.test.ts > Manager Agent Responses loop > supplies the minimal Video One tool set for a valid release turn",
          }

          if not failures:
              print('The full suite failed, but Vitest failure titles could not be parsed. Tail of log:')
              print('\n'.join(text.splitlines()[-160:]))
              sys.exit(1)

          unexpected = sorted(set(failures) - known)
          if unexpected:
              print('Unexpected full-suite failures:')
              for failure in unexpected:
                  print(f'  - {failure}')
              print('\nTail of full-suite log:')
              print('\n'.join(text.splitlines()[-200:]))
              sys.exit(1)

          accepted = sorted(set(failures) & known)
          print('Full-suite audit found only explicitly documented compatibility assertions:')
          for failure in accepted:
              print(f'  - {failure}')
          print('Focused replacement coverage is enforced by the separate product-test job.')
          PY

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
