name: PR Safety

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: http://localhost:54321
  VITE_SUPABASE_ANON_KEY: ci-test-anon-key

jobs:
  type-regression:
    name: Browser type regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head with base history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compare TypeScript diagnostics with main
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"

          git checkout --detach "$BASE_SHA"
          npx tsc --noEmit --pretty false > /tmp/tsc-base.txt 2>&1 || true

          git checkout --detach "$HEAD_SHA"
          npx tsc --noEmit --pretty false > /tmp/tsc-head.txt 2>&1 || true

          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          import sys

          location = re.compile(r'\(\d+,\d+\)')

          def diagnostics(path):
              lines = []
              for raw in Path(path).read_text(errors='replace').splitlines():
                  line = location.sub('(LINE,COL)', raw.strip())
                  # Root tsc is a browser-oriented check. Supabase Edge modules use
                  # explicit .ts specifiers by Deno convention and are checked below
                  # with Deno instead of treating TS5097 as a browser regression.
                  if line.startswith('supabase/functions/') and 'error TS5097:' in line:
                      continue
                  lines.append(line)
              return Counter(lines)

          base = diagnostics('/tmp/tsc-base.txt')
          head = diagnostics('/tmp/tsc-head.txt')
          added = head - base
          removed = base - head

          if added:
              print('New TypeScript diagnostics introduced by this PR:')
              for line, count in sorted(added.items()):
                  for _ in range(count):
                      print(f'  + {line}')
              if removed:
                  print('\nBaseline diagnostics removed or moved:')
                  for line, count in sorted(removed.items()):
                      for _ in range(count):
                          print(f'  - {line}')
              sys.exit(1)

          print('No new browser TypeScript diagnostics were introduced.')
          if removed:
              print(f'The PR removes {sum(removed.values())} baseline diagnostic line(s).')
          PY

  edge-typecheck:
    name: Structured document Deno check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check new Edge helpers
        run: >-
          deno check
          supabase/functions/_shared/songDocumentStandards.ts
          supabase/functions/_shared/songDocumentDraft.ts

  focused-tests:
    name: Record servicing and campaign tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run affected product tests
        run: >-
          npx vitest run --environment jsdom --pool=vmThreads
          src/record-servicing-tool-selection.test.ts
          src/record-servicing-opportunity-ui.test.tsx
          src/release-success-conversation.test.tsx
          src/song-campaign-state.test.ts
          src/song-campaign-ui.test.tsx
          src/song-document-persistence-v2.test.ts
          src/song-document-quality-gate.test.ts
          src/song-document-standards.test.ts
          src/music-share-internal-narrative.test.ts

  full-tests:
    name: Full repository test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No compatibility allowlist: the repository suite itself must exit cleanly.
      - name: Run full suite
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
