name: Home premium phase 3 release gate

on:
  workflow_dispatch:
  push:
    branches:
      - design/home-premium-phase-3

permissions:
  contents: write

concurrency:
  group: home-premium-phase-3-release-gate
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[home-qa-clean]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/home-premium-phase-3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y chromium

      - name: Focused Home and inherited workspace contracts
        run: |
          npx vitest run \
            src/desk-hq-editorial.test.tsx \
            src/production-app-shell.test.tsx \
            src/workspace-activity-center.test.tsx \
            src/workspace-live-sync.test.ts \
            src/manager-premium-phase-1.test.tsx \
            --environment jsdom --pool=vmThreads

      - name: Full repository suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: TypeScript regression against completed Activity base
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=9714477c0defbd7774948f215adee8abe96f4788
          mkdir -p /tmp/home-ts

          npx tsc --noEmit --pretty false > /tmp/home-ts/head.txt 2>&1 || true
          grep -E 'error TS[0-9]+:' /tmp/home-ts/head.txt \
            | sed -E 's/\([0-9]+,[0-9]+\)//g' \
            | sort -u > /tmp/home-ts/head-errors.txt || true

          git worktree add --detach /tmp/activity-base "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/activity-base/node_modules
          (
            cd /tmp/activity-base
            ./node_modules/.bin/tsc --noEmit --pretty false > /tmp/home-ts/base.txt 2>&1 || true
          )
          grep -E 'error TS[0-9]+:' /tmp/home-ts/base.txt \
            | sed -E 's/\([0-9]+,[0-9]+\)//g' \
            | sort -u > /tmp/home-ts/base-errors.txt || true

          comm -13 /tmp/home-ts/base-errors.txt /tmp/home-ts/head-errors.txt > /tmp/home-ts/new-errors.txt
          echo "Baseline TypeScript errors: $(wc -l < /tmp/home-ts/base-errors.txt)"
          echo "Head TypeScript errors: $(wc -l < /tmp/home-ts/head-errors.txt)"
          echo "New TypeScript errors: $(wc -l < /tmp/home-ts/new-errors.txt)"
          if [ -s /tmp/home-ts/new-errors.txt ]; then
            cat /tmp/home-ts/new-errors.txt
            exit 1
          fi

      - name: Start production preview and Chromium
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/home-preview.log 2>&1 &
          echo $! > /tmp/home-preview.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep .25
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          chromium \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --remote-debugging-port=9222 \
            --remote-debugging-address=127.0.0.1 \
            --user-data-dir=/tmp/home-chrome-profile \
            --window-size=1440,1000 \
            'about:blank' > /tmp/home-chrome.log 2>&1 &
          echo $! > /tmp/home-chrome.pid

      - name: Production fixture Chromium smoke
        env:
          DESK_SMOKE_URL: http://127.0.0.1:4173/?fixtures=true&view=labelHQ
        run: node scripts/chrome-production-smoke.mjs

      - name: Premium Home desktop and mobile Chromium smoke
        shell: bash
        run: |
          cat > /tmp/home-premium-smoke.mjs <<'NODE'
          import http from "node:http";

          const timeoutMs = 20000;
          const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const runtimeFailures = [];

          function fetchJson(path) {
            return new Promise((resolve, reject) => {
              const req = http.get({ host: "127.0.0.1", port: 9222, path }, (res) => {
                let body = "";
                res.setEncoding("utf8");
                res.on("data", (chunk) => { body += chunk; });
                res.on("end", () => {
                  try { resolve(JSON.parse(body)); } catch (error) { reject(error); }
                });
              });
              req.on("error", reject);
            });
          }

          async function websocketUrl() {
            const started = Date.now();
            while (Date.now() - started < timeoutMs) {
              try {
                const pages = await fetchJson("/json");
                const page = pages.find((candidate) => candidate.type === "page");
                if (page?.webSocketDebuggerUrl) return page.webSocketDebuggerUrl;
              } catch {}
              await delay(200);
            }
            throw new Error("Timed out waiting for Chromium debugger");
          }

          const socket = new WebSocket(await websocketUrl());
          const pending = new Map();
          let nextId = 0;
          socket.addEventListener("message", (event) => {
            const message = JSON.parse(String(event.data));
            if (message.id && pending.has(message.id)) {
              const task = pending.get(message.id);
              pending.delete(message.id);
              if (message.error) task.reject(new Error(message.error.message));
              else task.resolve(message.result);
              return;
            }
            if (message.method === "Runtime.exceptionThrown") {
              runtimeFailures.push(message.params?.exceptionDetails?.exception?.description ?? message.params?.exceptionDetails?.text ?? "runtime exception");
            }
            if (message.method === "Runtime.consoleAPICalled" && message.params?.type === "error") {
              runtimeFailures.push((message.params.args ?? []).map((arg) => arg.value ?? arg.description ?? "console error").join(" "));
            }
          });
          await new Promise((resolve, reject) => {
            socket.addEventListener("open", resolve, { once: true });
            socket.addEventListener("error", reject, { once: true });
          });

          function command(method, params = {}) {
            const id = ++nextId;
            return new Promise((resolve, reject) => {
              pending.set(id, { resolve, reject });
              socket.send(JSON.stringify({ id, method, params }));
            });
          }
          async function evaluate(expression) {
            const result = await command("Runtime.evaluate", { expression, awaitPromise: true, returnByValue: true });
            if (result.exceptionDetails) throw new Error(result.exceptionDetails.text ?? "evaluate failed");
            return result.result?.value;
          }
          async function waitForHome() {
            const started = Date.now();
            while (Date.now() - started < timeoutMs) {
              const ready = await evaluate(`Boolean(document.querySelector('[data-testid="desk-editorial-brief"]'))`);
              if (ready) return;
              await delay(200);
            }
            throw new Error("Premium Home did not render");
          }
          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }
          async function navigateHome(width, height) {
            runtimeFailures.length = 0;
            await command("Emulation.setDeviceMetricsOverride", { width, height, deviceScaleFactor: 1, mobile: width < 700 });
            await command("Page.navigate", { url: "http://127.0.0.1:4173/?fixtures=true&view=labelHQ" });
            await delay(600);
            await waitForHome();
            await delay(300);
          }

          await command("Runtime.enable");
          await command("Page.enable");

          await navigateHome(1440, 1000);
          const desktop = await evaluate(`(() => {
            const visible = (el) => Boolean(el && el.getBoundingClientRect().width > 0 && el.getBoundingClientRect().height > 0 && getComputedStyle(el).visibility !== 'hidden');
            const workspace = document.querySelector('.home-workspace');
            const headings = [...document.querySelectorAll('h1')].filter(visible).map((el) => (el.textContent ?? '').trim());
            const forms = [...document.querySelectorAll('form[aria-label="Ask your manager"]')].filter(visible);
            const rightNow = document.querySelector('[data-testid="desk-right-now"]');
            const headline = document.querySelector('[data-testid="desk-brief-headline"]');
            const metrics = [...document.querySelectorAll('[data-testid="desk-signal-metric"]')].filter(visible);
            const managerRead = document.querySelector('[data-testid="desk-manager-read"]');
            const rightButtons = rightNow ? [...rightNow.querySelectorAll('button')].filter(visible) : [];
            const overflow = document.documentElement.scrollWidth - document.documentElement.clientWidth;
            const headlineRect = headline?.getBoundingClientRect();
            const rightRect = rightNow?.getBoundingClientRect();
            return {
              workspace: visible(workspace), headings, forms: forms.length,
              rightButtons: rightButtons.length, metrics: metrics.length,
              managerRead: visible(managerRead), overflow,
              sideBySide: !rightNow || (Math.abs((headlineRect?.top ?? 0) - (rightRect?.top ?? 999)) < 50 && (rightRect?.left ?? 0) > (headlineRect?.left ?? 0)),
            };
          })()`);
          assert(desktop.workspace, "Desktop Home workspace is not visible");
          assert(desktop.headings.filter((title) => title === "Home").length === 1, `Expected one visible desktop Home heading, got ${desktop.headings.join(', ')}`);
          assert(desktop.forms === 1, `Expected one desktop Manager composer, got ${desktop.forms}`);
          assert(desktop.rightButtons <= 2, `Right Now rendered ${desktop.rightButtons} actions`);
          assert(desktop.metrics >= 1 && desktop.metrics <= 4, `Metric rail rendered ${desktop.metrics} items`);
          assert(desktop.managerRead, "Manager's Read is missing on desktop");
          assert(desktop.overflow <= 1, `Desktop Home horizontally overflows by ${desktop.overflow}px`);
          assert(desktop.sideBySide, "Desktop Right Now is not composed beside the brief headline");
          assert(runtimeFailures.length === 0, `Desktop runtime errors:\n${runtimeFailures.join('\n')}`);

          await navigateHome(390, 844);
          const mobile = await evaluate(`(() => {
            const visible = (el) => Boolean(el && el.getBoundingClientRect().width > 0 && el.getBoundingClientRect().height > 0 && getComputedStyle(el).visibility !== 'hidden');
            const forms = [...document.querySelectorAll('form[aria-label="Ask your manager"]')].filter(visible);
            const desktopHomeHeadings = [...document.querySelectorAll('[data-testid="workspace-header-Home"] h1')].filter(visible);
            const headline = document.querySelector('[data-testid="desk-brief-headline"]');
            const rightNow = document.querySelector('[data-testid="desk-right-now"]');
            const segments = [...document.querySelectorAll('[data-testid="desk-manager-read-segment"]')].filter(visible).map((el) => el.getBoundingClientRect());
            const overflow = document.documentElement.scrollWidth - document.documentElement.clientWidth;
            const headlineRect = headline?.getBoundingClientRect();
            const rightRect = rightNow?.getBoundingClientRect();
            return {
              forms: forms.length,
              desktopHomeHeadings: desktopHomeHeadings.length,
              overflow,
              rightBelow: !rightNow || (rightRect?.top ?? 0) > (headlineRect?.bottom ?? 0),
              segmentTops: segments.map((rect) => rect.top),
              segmentWidths: segments.map((rect) => rect.width),
            };
          })()`);
          assert(mobile.forms === 1, `Expected one mobile Manager composer, got ${mobile.forms}`);
          assert(mobile.desktopHomeHeadings === 0, "Desktop Home workspace header is visible on mobile");
          assert(mobile.overflow <= 1, `Mobile Home horizontally overflows by ${mobile.overflow}px`);
          assert(mobile.rightBelow, "Mobile Right Now did not stack below the brief");
          assert(mobile.segmentTops.every((top, index, list) => index === 0 || top > list[index - 1]), "Manager Read segments do not stack vertically on mobile");
          assert(mobile.segmentWidths.every((width) => width > 300), "Manager Read segments are unexpectedly narrow on mobile");
          assert(runtimeFailures.length === 0, `Mobile runtime errors:\n${runtimeFailures.join('\n')}`);

          socket.close();
          console.log("Premium Home desktop/mobile Chromium smoke passed.");
          NODE
          node /tmp/home-premium-smoke.mjs

      - name: Final diff hygiene
        run: git diff --check 9714477c0defbd7774948f215adee8abe96f4788..HEAD

      - name: Remove temporary Home QA scaffolding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/home-premium-phase-3-integrate.yml .github/workflows/home-premium-phase-3-qa.yml
          git commit -m "Remove temporary Home QA workflows [home-qa-clean]"
          git push origin HEAD:design/home-premium-phase-3
