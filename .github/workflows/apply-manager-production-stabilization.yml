name: Apply Manager Production Stabilization

on:
  push:
    branches:
      - fix/manager-production-stabilization
    paths:
      - scripts/apply-manager-stabilization.py
      - .github/workflows/apply-manager-production-stabilization.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v5

      - name: Apply audited production fixes
        run: python scripts/apply-manager-stabilization.py

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Manager regression tests
        run: >-
          npx vitest run --environment jsdom --pool=vmThreads
          src/song-document-quality-gate.test.ts
          src/manager-agent-resilience.test.ts
          src/manager-production-stabilization-contract.test.ts
          src/release-success-manager-tools.test.ts

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Manager production boundaries
        run: >-
          deno check
          supabase/functions/_shared/manager-conversation/context.ts
          supabase/functions/_shared/manager-conversation/agentLoop.ts
          supabase/functions/_shared/manager-conversation/toolExecutor.ts
          supabase/functions/_shared/songDocumentDraft.ts
          supabase/functions/manager-conversation/index.ts
          supabase/functions/manager-conversation-stream/index.ts

      - name: Remove one-shot patcher
        run: rm scripts/apply-manager-stabilization.py .github/workflows/apply-manager-production-stabilization.yml

      - name: Commit stabilization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize Manager production flows"
          git push
