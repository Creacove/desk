name: Mission release gate patch

on:
  push:
    branches:
      - design/mission-workspace-simplification
    paths:
      - .github/workflows/mission-release-gate-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/mission-workspace-simplification
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Remove fake persistence and add regression
        run: echo '' | base64 -d | python
      - name: Install dependencies
        run: npm ci
      - name: Run mission persistence regressions
        run: npx vitest run --environment jsdom --pool=vmThreads src/mission-task-deliverables.test.tsx src/mission-workspace-simplification.test.tsx
      - name: Commit patch and remove this temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/mission-release-gate-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/missions/MissionWorkSurface.tsx src/mission-task-deliverables.test.tsx .github/workflows/mission-release-gate-patch.yml
          git commit -m 'Harden mission evidence persistence'
          git push origin HEAD:design/mission-workspace-simplification
