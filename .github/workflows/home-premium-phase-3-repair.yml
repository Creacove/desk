name: Home premium phase 3 regression repair

on:
  workflow_dispatch:
  push:
    branches:
      - design/home-premium-phase-3

permissions:
  contents: write

concurrency:
  group: home-premium-phase-3-regression-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/home-premium-phase-3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Migrate legacy Home shell assertions
        run: |
          python scripts/migrate-home-phase3-tests.py
          sed -i 's/expect(metrics).toHaveTextContent("18");/expect(metrics).toHaveTextContent("11%");/' src/production-app-shell.test.tsx

      - name: Focused Home and shell contracts
        run: |
          npx vitest run \
            src/desk-hq-editorial.test.tsx \
            src/production-app-shell.test.tsx \
            --environment jsdom --pool=vmThreads

      - name: Production build
        run: npm run build

      - name: Diff hygiene
        run: git diff --check

      - name: Commit migrated contracts and remove repair scaffolding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/home-premium-phase-3-integrate.yml .github/workflows/home-premium-phase-3-repair.yml scripts/migrate-home-phase3-tests.py
          git add src/production-app-shell.test.tsx
          git commit -m "Migrate Home regression contracts [home-regression-migrated]"
          git push origin HEAD:design/home-premium-phase-3
