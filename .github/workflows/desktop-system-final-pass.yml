name: Desktop system final pass

on:
  push:
    branches:
      - design/desktop-system-final-pass
    paths:
      - scripts/desktop_system_final_pass.py
      - .github/workflows/desktop-system-final-pass.yml

permissions:
  contents: write

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout desktop branch
        uses: actions/checkout@v5
        with:
          ref: design/desktop-system-final-pass
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply final desktop patch
        run: python3 scripts/desktop_system_final_pass.py

      - name: Install dependencies
        run: npm ci

      - name: Desktop TDD contracts
        run: >-
          npx vitest run
          src/design-system/desktop-primitives.test.tsx
          src/desktop-finish-contract.test.ts
          src/manager-premium-phase-1.test.tsx
          src/mission-workspace-simplification.test.tsx
          src/mission-task-deliverables.test.tsx
          src/workspace-activity-center.test.tsx
          src/settings-screen.test.tsx
          src/split-confirmation-portal.test.tsx
          src/song-room-manager-hierarchy.test.ts
          src/song-room-red-antler-overview.test.ts
          --environment jsdom --pool=vmThreads

      - name: Full repository suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit verified desktop patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/ProductionApp.tsx \
            src/types/cleanProduction.ts \
            src/services/productionSupabase.ts \
            src/features/music/MusicScreens.tsx \
            src/features/manager/ManagerScreensLegacy.tsx \
            src/song-room-manager-hierarchy.test.ts \
            src/song-room-red-antler-overview.test.ts \
            src/desktop-finish-contract.test.ts
          git diff --cached --check
          git commit -m 'design: finish desktop work language and timestamp data path [skip ci]'
          git push origin HEAD:design/desktop-system-final-pass
