name: One-shot Manager package wiring

on:
  push:
    branches: [agent/record-servicing-manager-mode]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/record-servicing-manager-mode

      - name: Wire Manager package tool
        shell: python
        run: |
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
            count = source.count(old)
            if count != 1:
              raise SystemExit(f'{label}: expected one anchor, found {count}')
            return source.replace(old, new, 1)

          agent_path = Path('supabase/functions/_shared/manager-conversation/agentLoop.ts')
          agent = agent_path.read_text()

          schema_anchor = 'const focusedMusicMetadataProperties = {'
          package_schema = '''const focusedReleaseSharePackageProperties = {
            type: "object",
            additionalProperties: false,
            required: ["preset", "opportunityId", "label"],
            properties: {
              preset: { type: "string", enum: ["listen", "epk_press", "delivery", "custom"] },
              opportunityId: { type: ["string", "null"] },
              label: { type: ["string", "null"] },
            },
          };

          '''
          if 'const focusedReleaseSharePackageProperties' not in agent:
            agent = replace_once(agent, schema_anchor, package_schema + schema_anchor, 'package schema')

          if 'name: "prepare_focused_release_share_package"' not in agent:
            marker = '    name: "read_focused_release_readiness",'
            marker_index = agent.find(marker)
            if marker_index < 0:
              raise SystemExit('package tool: readiness marker not found')
            block_start = agent.rfind('  {', 0, marker_index)
            if block_start < 0:
              raise SystemExit('package tool: readiness block start not found')
            package_tool = '''  {
            type: "function",
            name: "prepare_focused_release_share_package",
            description: "Prepare a frozen, revocable private package for the exact attached song from approved canonical Files content. Optionally bind it to one saved release opportunity. This only prepares a reviewable link; it never emails, submits, posts, spends, or contacts anyone.",
            strict: true,
            parameters: focusedReleaseSharePackageProperties,
          },
          '''
            agent = agent[:block_start] + package_tool + agent[block_start:]

          if '"prepare_focused_release_share_package"' not in agent[agent.find('const releaseTurnToolNames'):agent.find('export function selectManagerConversationToolsForTurn')]:
            set_start = agent.find('const releaseTurnToolNames = new Set([')
            set_end = agent.find(']);', set_start)
            if set_start < 0 or set_end < 0:
              raise SystemExit('release tool set markers not found')
            agent = agent[:set_end] + '  "prepare_focused_release_share_package",\n' + agent[set_end:]

          intent_anchor = '  const outcomeIntent = /\\b(submitted|replied|accepted|declined|outcome|response from|heard back)\\b/.test(body);'
          package_intent = '''  const packageIntent = /\\b(prepare|build|create|make|assemble)\\b/.test(body)
            && /\\b(package|share link|private link|delivery link|press kit|epk package)\\b/.test(body);
          '''
          if 'const packageIntent =' not in agent:
            agent = replace_once(agent, intent_anchor, package_intent + intent_anchor, 'package intent')

          outcome_allowed_anchor = '  if (outcomeIntent) allowed.add("record_focused_release_opportunity_outcome");'
          if 'if (packageIntent) allowed.add("prepare_focused_release_share_package");' not in agent:
            agent = replace_once(
              agent,
              outcome_allowed_anchor,
              '  if (packageIntent) allowed.add("prepare_focused_release_share_package");\n' + outcome_allowed_anchor,
              'package intent selection',
            )

          summary_anchor = '  if (name === "create_focused_song_document") return "Building and quality-checking a campaign document.";'
          if 'Preparing a private release package.' not in agent:
            agent = replace_once(
              agent,
              summary_anchor,
              summary_anchor + '\n  if (name === "prepare_focused_release_share_package") return "Preparing a private release package.";',
              'package tool summary',
            )

          agent_path.write_text(agent)

          executor_path = Path('supabase/functions/_shared/manager-conversation/toolExecutor.ts')
          executor = executor_path.read_text()

          switch_anchor = '  if (name === "create_focused_song_document") return createFocusedSongDocument(db, input, args);'
          if 'prepare_focused_release_share_package") return prepareFocusedReleaseSharePackage' not in executor:
            executor = replace_once(
              executor,
              switch_anchor,
              switch_anchor + '\n  if (name === "prepare_focused_release_share_package") return prepareFocusedReleaseSharePackage(db, input, args);',
              'executor switch',
            )

          function_anchor = 'async function loadOpportunityContext(db: SupabaseLike, input: ManagerToolInput, opportunityType: "playlist" | "press") {'
          package_function = '''async function prepareFocusedReleaseSharePackage(db: SupabaseLike, input: ManagerToolInput, args: Record<string, unknown>) {
            const subject = requireFocusedMusicSubject(input);
            if (subject.type !== "music_item") {
              return { status: "not_allowed", reason: "Release share packages are currently scoped to an attached song." };
            }
            if (typeof db.rpc !== "function") throw new Error("Release share package persistence is unavailable.");

            const preset = requiredReleaseSharePreset(args.preset);
            const opportunityId = stringArg(args.opportunityId) || null;
            const label = stringArg(args.label) || null;
            const { data, error } = await db.rpc("prepare_focused_release_share_package_v1", {
              p_account_id: input.accountId,
              p_artist_workspace_id: input.artistWorkspaceId,
              p_artist_id: input.artistId,
              p_music_item_id: subject.id,
              p_preset: preset,
              p_label: label,
              p_opportunity_id: opportunityId,
              p_run_id: input.runId ?? null,
            });
            if (error) throw error;
            const receipt = record(data);
            const rawToken = stringArg(receipt.rawToken).toLowerCase();
            const shareLinkId = stringArg(receipt.shareLinkId);
            if (!shareLinkId || !/^[0-9a-f]{64}$/.test(rawToken)) {
              throw new Error("Release share package transaction returned an invalid receipt.");
            }

            return {
              status: "prepared",
              shareLinkId,
              url: releaseShareUrl(rawToken),
              label: stringArg(receipt.label),
              preset: stringArg(receipt.preset) || preset,
              musicItemId: subject.id,
              ...(opportunityId ? { opportunityId } : {}),
              documentCount: integerOrZero(receipt.documentCount),
              assetCount: integerOrZero(receipt.assetCount),
              note: "Preparation only — nothing was sent or submitted.",
            };
          }

          '''
          if 'async function prepareFocusedReleaseSharePackage' not in executor:
            executor = replace_once(executor, function_anchor, package_function + function_anchor, 'package executor function')

          helper_anchor = 'function stringArg(value: unknown) {\n  return typeof value === "string" ? value.trim() : "";\n}'
          helpers = '''function requiredReleaseSharePreset(value: unknown): "listen" | "epk_press" | "delivery" | "custom" {
            const preset = stringArg(value);
            if (preset === "listen" || preset === "epk_press" || preset === "delivery" || preset === "custom") return preset;
            throw new Error("Release share package preset is invalid.");
          }

          function releaseShareUrl(token: string) {
            const deno = (globalThis as any).Deno;
            const origin = deno?.env?.get?.("PUBLIC_APP_URL") ?? deno?.env?.get?.("APP_ORIGIN") ?? "https://app.ordersounds.com";
            return `${String(origin).replace(/\\/$/, "")}/share?token=${encodeURIComponent(token)}`;
          }

          '''
          if 'function requiredReleaseSharePreset' not in executor:
            executor = replace_once(executor, helper_anchor, helpers + helper_anchor, 'package helpers')

          executor_path.write_text(executor)

          share_path = Path('supabase/functions/music-share-links/index.ts')
          share = share_path.read_text()
          share = share.replace('\nfor (const document of documents ?? []) {\n', '\n  for (const document of documents ?? []) {\n', 1)
          share = share.replace('\n  const internalNarrative = document.document_type === "release_narrative"\n', '\n    const internalNarrative = document.document_type === "release_narrative"\n', 1)
          share = share.replace('\n    || cleanText(document.title, 180).toLowerCase() === "release narrative";\n', '\n      || cleanText(document.title, 180).toLowerCase() === "release narrative";\n', 1)
          share = share.replace('\n  if (internalNarrative) throw new Error("The internal Release Narrative cannot be shared.");\n', '\n    if (internalNarrative) throw new Error("The internal Release Narrative cannot be shared.");\n', 1)
          share = share.replace('\n  if (document.origin === "manager_generated" && document.status !== "accepted") {\n', '\n    if (document.origin === "manager_generated" && document.status !== "accepted") {\n', 1)
          share = share.replace('\n    throw new Error("Manager-built documents must be approved before sharing.");\n  }\n}\n', '\n      throw new Error("Manager-built documents must be approved before sharing.");\n    }\n  }\n', 1)
          share_path.write_text(share)

          Path('.github/workflows/one-shot-manager-package.yml').unlink()

      - name: Commit wiring and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/manager-conversation/agentLoop.ts supabase/functions/_shared/manager-conversation/toolExecutor.ts supabase/functions/music-share-links/index.ts .github/workflows/one-shot-manager-package.yml
          git commit -m "feat: let Manager prepare private release packages"
          git push origin HEAD:agent/record-servicing-manager-mode
