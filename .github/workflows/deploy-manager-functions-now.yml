name: Deploy Manager Edge hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-manager-functions-now.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: bbwbxmnanccwottrmkqu
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require Supabase deployment token
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Deploy manager-conversation
        run: supabase functions deploy manager-conversation --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy manager-conversation-stream
        run: supabase functions deploy manager-conversation-stream --project-ref "$SUPABASE_PROJECT_REF"
