name: Final Home value contract fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/home-test-fix.yml

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/home-redesign
          fetch-depth: 0
      - name: Fix final Home value source contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/production-app-shell.test.tsx")
          text = path.read_text()
          old = 'expect(readFileSync(join(process.cwd(), "src", "features", "desk", "DeskHQ.tsx"), "utf8")).not.toContain("metric.value}</p>");'
          new = "expect(readFileSync(join(process.cwd(), \"src\", \"features\", \"desk\", \"DeskHQ.tsx\"), \"utf8\")).toContain('mt-2 break-words text-[21px] font-semibold leading-none tracking-[-0.015em] text-foreground\">{value}</p>');"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected one stale metric value source contract, found {count}")
          path.write_text(text.replace(old, new))
          PY
      - name: Commit final value contract fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/production-app-shell.test.tsx
          git commit -m "test: validate readable Home metric values"
          git push origin HEAD:design/home-redesign
