name: Final Home test fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/home-test-fix.yml

permissions:
  contents: write

jobs:
  fix-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/home-redesign
          fetch-depth: 0
      - name: Fix final stale Home test contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/production-app-shell.test.tsx")
          text = path.read_text()
          replacements = [
              (
                  'expect(mobileMetrics).not.toHaveTextContent("Spotify");',
                  'expect(mobileMetrics).toHaveTextContent("Spotify");',
              ),
              (
                  'expect(mobileMetrics).not.toHaveTextContent("city signal");',
                  'expect(mobileMetrics).toHaveTextContent("city signal");',
              ),
              (
                  'toContain(\'break-words text-[11px] font-semibold leading-tight text-muted-foreground">{metric.label}</p>\');',
                  'toContain(\'break-words text-[11px] font-semibold leading-tight text-muted-foreground">{label}</p>\');',
              ),
          ]

          changed = 0
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new)
              changed += count

          path.write_text(text)
          print(f"Updated {changed} final stale Home test contracts")
          PY
      - name: Commit final test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/production-app-shell.test.tsx
          git commit -m "test: finish Home regression contract migration"
          git push origin HEAD:design/home-redesign
