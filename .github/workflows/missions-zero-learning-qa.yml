name: Missions zero-learning final gate

on:
  push:
    branches: [design/missions-zero-learning-ux]

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: http://localhost:54321
  VITE_SUPABASE_ANON_KEY: ci-test-anon-key

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/missions-zero-learning-ux
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove temporary Missions QA machinery in working tree
        shell: bash
        run: |
          rm -f .github/workflows/missions-contract-migration.yml
          rm -f .github/workflows/missions-zero-learning-qa.yml
          rm -f scripts/finalize-missions-source.py
          rm -f scripts/migrate-missions-zero-learning-tests.py
          rm -f scripts/run-missions-zero-learning-migration.py
          git diff --check
      - name: Full repository suite on clean tree
        run: npm test
      - name: Production build on clean tree
        run: npm run build
      - name: Chromium production-shell smoke on clean tree
        shell: bash
        env:
          VITE_APP_MODE: production
          VITE_PRODUCTION_FIXTURES: "true"
        run: |
          set -euo pipefail
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/desk-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true; kill "$CHROME_PID" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4173 >/dev/null
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/desk-chrome about:blank > /tmp/desk-chrome.log 2>&1 &
          CHROME_PID=$!
          node scripts/chrome-production-smoke.mjs
      - name: Commit only the tested cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "Remove temporary Missions QA machinery"
          git push origin HEAD:design/missions-zero-learning-ux
