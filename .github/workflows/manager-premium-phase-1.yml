name: Manager premium phase 1

on:
  push:
    branches:
      - design/manager-premium-phase-1
    paths:
      - scripts/manager_premium_phase_1.py
      - scripts/manager_premium_phase_1_fix1.py
      - scripts/manager_premium_phase_1_fix2.py
      - .github/workflows/manager-premium-phase-1.yml

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: http://localhost:54321
  VITE_SUPABASE_ANON_KEY: test-anon-key

jobs:
  apply-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/manager-premium-phase-1
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply Manager premium phase
        run: |
          python3 scripts/manager_premium_phase_1.py
          python3 scripts/manager_premium_phase_1_fix1.py
          python3 scripts/manager_premium_phase_1_fix2.py

      - name: Install dependencies
        run: npm ci

      - name: Focused Manager UX regressions
        run: >-
          npx vitest run --environment jsdom --pool=vmThreads
          src/manager-premium-phase-1.test.tsx
          src/record-servicing-opportunity-ui.test.tsx
          src/features/manager/managerArtifactExperience.test.ts
          src/features/manager/managerPresentation.test.ts
          src/production-app-shell.test.tsx

      - name: Full repository suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Browser TypeScript regression against main
        shell: bash
        run: |
          set -euo pipefail
          git diff -- src/features/manager/ManagerScreens.tsx src/features/manager/ManagerComposer.tsx src/features/manager/OpportunityArtifact.tsx src/app/ProductionApp.tsx src/record-servicing-opportunity-ui.test.tsx src/manager-premium-phase-1.test.tsx src/production-app-shell.test.tsx > /tmp/manager-phase.patch
          npx tsc --noEmit --pretty false > /tmp/tsc-head.txt 2>&1 || true
          git stash push -u -m manager-phase-qa
          git checkout --detach origin/main
          npx tsc --noEmit --pretty false > /tmp/tsc-base.txt 2>&1 || true
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re, sys
          location = re.compile(r'\(\d+,\d+\)')
          def diagnostics(path):
              lines=[]
              for raw in Path(path).read_text(errors='replace').splitlines():
                  line=location.sub('(LINE,COL)', raw.strip())
                  if line.startswith('supabase/functions/') and 'error TS5097:' in line:
                      continue
                  lines.append(line)
              return Counter(lines)
          base=diagnostics('/tmp/tsc-base.txt')
          head=diagnostics('/tmp/tsc-head.txt')
          added=head-base
          if added:
              print('New TypeScript diagnostics:')
              for line,count in sorted(added.items()):
                  for _ in range(count): print(' +', line)
              sys.exit(1)
          print('No new TypeScript diagnostics introduced.')
          PY
          git checkout design/manager-premium-phase-1
          git stash pop

      - name: Build production fixture for Chromium
        env:
          VITE_APP_MODE: production
          VITE_PRODUCTION_FIXTURES: "true"
        run: npm run build

      - name: Start preview and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/desk-preview.log 2>&1 &
          echo $! > /tmp/desk-preview.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4173 >/dev/null
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/desk-chrome about:blank > /tmp/desk-chrome.log 2>&1 &
          echo $! > /tmp/desk-chrome.pid

      - name: Real Chromium production-shell smoke
        run: node scripts/chrome-production-smoke.mjs

      - name: Stop browser and preview
        if: always()
        run: |
          kill "$(cat /tmp/desk-chrome.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/desk-preview.pid 2>/dev/null)" 2>/dev/null || true

      - name: Commit implementation after QA
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/features/manager/ManagerScreens.tsx \
            src/features/manager/ManagerComposer.tsx \
            src/features/manager/OpportunityArtifact.tsx \
            src/app/ProductionApp.tsx \
            src/record-servicing-opportunity-ui.test.tsx \
            src/manager-premium-phase-1.test.tsx \
            src/production-app-shell.test.tsx
          git commit -m 'design: make Manager premium and obvious'
          git push origin HEAD:design/manager-premium-phase-1
