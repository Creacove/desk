name: Activity Center Phase 2 Contract Cleanup

on:
  push:
    branches:
      - design/activity-center-phase-2
    paths:
      - .github/workflows/activity-center-phase-2-fix-contracts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/activity-center-phase-2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Separate synchronization and unread cursors
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/services/workspaceLiveSync.ts')
          source = path.read_text()
          old = '''  const cursorKey = `ordersounds.activityCursor.v1:${options.userId}:${options.workspaceId}`;\n  const coalesceMs = options.coalesceMs ?? 250;\n  let cursor = readCursor(storage, cursorKey);'''
          new = '''  // Synchronization progress is infrastructure state. Keep it separate from the\n  // Activity Center's user-facing seen/unread cursor so catch-up never marks\n  // unseen notifications as read.\n  const syncCursorKey = `ordersounds.workspaceSyncCursor.v1:${options.userId}:${options.workspaceId}`;\n  const coalesceMs = options.coalesceMs ?? 250;\n  let cursor = readCursor(storage, syncCursorKey);'''
          if old not in source:
            raise SystemExit('workspace sync cursor source contract not found')
          source = source.replace(old, new)
          old_flush = '''    const next = pendingInvalidations;\n    pendingInvalidations = [];\n    options.onInvalidations(next);'''
          new_flush = '''    const next = pendingInvalidations;\n    pendingInvalidations = [];\n    if (cursor) storage.setItem(syncCursorKey, JSON.stringify(cursor));\n    options.onInvalidations(next);'''
          if old_flush not in source:
            raise SystemExit('workspace sync flush contract not found')
          source = source.replace(old_flush, new_flush)
          source = source.replace('''    if (shouldReconcile) {\n      if (cursor) storage.setItem(cursorKey, JSON.stringify(cursor));\n      await options.onReconcile?.();\n    }''', '''    if (shouldReconcile) {\n      await options.onReconcile?.();\n    }''')
          path.write_text(source)

          test = Path('src/workspace-live-sync.test.ts')
          tests = test.read_text()
          old_expect = '''    expect(JSON.parse(storage.getItem("ordersounds.activityCursor.v1:user-a:workspace-a")!)).toEqual({\n      createdAt: pages[2][49].createdAt,\n      id: pages[2][49].id,\n    });'''
          new_expect = '''    expect(JSON.parse(storage.getItem("ordersounds.workspaceSyncCursor.v1:user-a:workspace-a")!)).toEqual({\n      createdAt: pages[2][49].createdAt,\n      id: pages[2][49].id,\n    });\n    expect(storage.getItem("ordersounds.activityCursor.v1:user-a:workspace-a")).toBeNull();'''
          if old_expect not in tests:
            raise SystemExit('workspace sync test cursor contract not found')
          tests = tests.replace(old_expect, new_expect)
          test.write_text(tests)
          PY
      - name: Verify cursor separation
        run: |
          grep -n -F 'ordersounds.workspaceSyncCursor.v1' src/services/workspaceLiveSync.ts src/workspace-live-sync.test.ts
          ! grep -n -F 'const cursorKey = `ordersounds.activityCursor.v1' src/services/workspaceLiveSync.ts
          git diff --check
          git diff -- src/services/workspaceLiveSync.ts src/workspace-live-sync.test.ts
      - name: Commit production hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/workspaceLiveSync.ts src/workspace-live-sync.test.ts
          if git diff --cached --quiet; then
            echo "No cursor hardening changes needed."
            exit 0
          fi
          git commit -m "Separate Activity seen and sync cursors"
          git push origin HEAD:design/activity-center-phase-2
