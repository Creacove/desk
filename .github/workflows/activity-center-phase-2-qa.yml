name: Activity Center Phase 2 QA

on:
  push:
    branches:
      - design/activity-center-phase-2
    paths:
      - src/features/notifications/WorkspaceActivityCenter.tsx
      - src/workspace-activity-center.test.tsx
      - src/production-app-shell.test.tsx
      - src/supabase-client.test.ts
      - .github/workflows/activity-center-phase-2-qa.yml
      - .github/workflows/activity-center-phase-2-fix-contracts.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reject stale Activity contracts
        run: |
          if grep -R -n -F "Your workspace, as it happens" src --include='*.test.ts' --include='*.test.tsx'; then
            echo "Stale Activity Center dialog contract remains in tests."
            exit 1
          fi
          if grep -R -n -E 'toHaveTextContent\("(Needs you|Background activity|Nothing is waiting on you)' src/production-app-shell.test.tsx; then
            echo "Stale bucket-based Activity Center assertions remain."
            exit 1
          fi
      - name: Activity regression
        run: npx vitest run src/workspace-activity-center.test.tsx --environment jsdom
      - name: Full repository suite
        run: npm test -- --run
      - name: Production build
        run: npm run build
