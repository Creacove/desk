name: Activity Center Phase 2 QA

on:
  push:
    branches:
      - design/activity-center-phase-2
    paths:
      - src/features/notifications/WorkspaceActivityCenter.tsx
      - src/workspace-activity-center.test.tsx
      - .github/workflows/activity-center-phase-2-qa.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show stale Activity contracts
        run: grep -R -n -F "Recently completed" src --include='*.test.ts' --include='*.test.tsx' || true
      - name: Activity regression
        run: npx vitest run src/workspace-activity-center.test.tsx --environment jsdom
      - name: Full repository suite
        run: npm test -- --run
      - name: Production build
        run: npm run build
