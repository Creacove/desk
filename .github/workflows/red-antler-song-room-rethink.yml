name: Red Antler song room rethink
on:
  push:
    paths:
      - scripts/red_antler_song_room_rethink.py
      - scripts/red_antler_song_room_rethink_fix.py
      - .github/workflows/red-antler-song-room-rethink.yml
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply minimal song room redesign
        run: |
          python3 scripts/red_antler_song_room_rethink.py
          python3 scripts/red_antler_song_room_rethink_fix.py
      - run: npm ci
      - name: Focused song room contract
        run: npx vitest run src/song-room-red-antler-overview.test.ts --environment jsdom --pool=vmThreads
      - name: Full repository test suite
        run: npx vitest run --pool=vmThreads
      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Commit redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/music/MusicScreens.tsx src/app/ProductionApp.tsx src/song-room-red-antler-overview.test.ts
          git commit -m 'feat: simplify song room around Manager read'
          git push origin main
