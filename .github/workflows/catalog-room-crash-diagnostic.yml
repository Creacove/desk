name: Catalog room crash hotfix

on:
  push:
    branches:
      - hotfix/catalog-room-crash
    paths:
      - .github/workflows/catalog-room-crash-diagnostic.yml
      - scripts/catalog_room_crash_hotfix.py
      - src/catalog-room-crash.test.tsx

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hotfix/catalog-room-crash
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply crash hotfix
        run: python3 scripts/catalog_room_crash_hotfix.py
      - run: npm ci
      - name: Thinking orb runtime regression
        run: npx vitest run src/catalog-room-crash.test.tsx --environment jsdom --pool=vmThreads
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Song and project room regressions
        run: npx vitest run src/production-app-shell.test.tsx --environment jsdom --pool=vmThreads
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Full repository suite
        run: npx vitest run --environment jsdom --pool=vmThreads
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Commit crash hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/design-system/AppThinkingOrb.tsx src/features/music/MusicScreens.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: prevent catalog room orb crash'
          git push origin HEAD:hotfix/catalog-room-crash
