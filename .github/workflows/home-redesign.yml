name: Home redesign

on:
  push:
    branches:
      - design/home-redesign
    paths:
      - .github/workflows/home-redesign.yml
      - scripts/home_redesign.py
      - src/desk-hq-editorial.test.tsx

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/home-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply Home redesign
        run: python3 scripts/home_redesign.py
      - name: Align tests with Home navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shell_path = Path("src/production-app-shell.test.tsx")
          shell = shell_path.read_text()
          old_shell = 'name: "Desk HQ"'
          shell_occurrences = shell.count(old_shell)
          if shell_occurrences < 1:
              raise SystemExit("Expected Desk HQ navigation assertions in production shell tests")
          shell_path.write_text(shell.replace(old_shell, 'name: "Home"'))
          print(f"Updated {shell_occurrences} production shell navigation assertions to Home")

          spacing_path = Path("src/design-system-spacing.test.tsx")
          spacing = spacing_path.read_text()
          old_spacing = '''expect(desk).toContain('eyebrow="Desk HQ"');'''
          if old_spacing not in spacing:
              raise SystemExit("Expected Desk HQ naming assertion in design-system spacing test")
          spacing_path.write_text(
              spacing.replace(
                  old_spacing,
                  '''expect(desk).toContain(">Home</h1>");\n    expect(desk).not.toContain("Desk HQ");''',
              )
          )
          print("Updated design-system naming assertion to Home")
          PY
      - run: npm ci
      - name: Home editorial contract
        run: npm test -- src/desk-hq-editorial.test.tsx
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Production shell regressions
        run: npm test -- src/production-app-shell.test.tsx
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Visible naming contract
        run: |
          ! grep -F 'Desk HQ' src/features/desk/DeskHQ.tsx
          ! grep -F 'Desk HQ' src/design-system/components.tsx
          grep -F '{ label: "Home", active: "labelHQ"' src/design-system/components.tsx
      - name: Full repository suite
        run: npm test
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Commit Home redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/desk/DeskHQ.tsx src/design-system/components.tsx src/production-app-shell.test.tsx src/design-system-spacing.test.tsx
          if git diff --cached --quiet; then
            echo "No generated source changes to commit"
            exit 0
          fi
          git commit -m "design: make Home the artist operating overview"
          git push origin HEAD:design/home-redesign
