name: Home redesign

on:
  push:
    branches:
      - design/home-redesign
    paths:
      - .github/workflows/home-redesign.yml
      - scripts/home_redesign.py
      - src/desk-hq-editorial.test.tsx
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/home-redesign.yml
      - scripts/home_redesign.py
      - src/desk-hq-editorial.test.tsx

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/home-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply Home redesign
        run: python3 scripts/home_redesign.py
      - name: Align tests with Home navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shell_path = Path("src/production-app-shell.test.tsx")
          shell = shell_path.read_text()

          replacements = [
              (
                  'screen.findByRole("heading", { name: "Desk HQ" })',
                  'screen.findAllByRole("heading", { name: "Home" }).then(([heading]) => heading)',
              ),
              (
                  'screen.getByRole("heading", { name: "Desk HQ" })',
                  'screen.getAllByRole("heading", { name: "Home" })[0]',
              ),
              (
                  'screen.queryByRole("heading", { name: "Desk HQ" })',
                  '(screen.queryAllByRole("heading", { name: "Home" })[0] ?? null)',
              ),
              (
                  'getByRole("button", { name: "Desk HQ" })',
                  'getByRole("button", { name: "Home" })',
              ),
              (
                  '"View supporting evidence"',
                  '"View evidence"',
              ),
              (
                  '"Ask your manager anything..."',
                  '"Ask Manager about anything in this workspace"',
              ),
              (
                  'expect(screen.getAllByText("Today\'s Brief").length).toBeGreaterThan(0);',
                  'expect(screen.getByTestId("desk-editorial-brief")).toBeInTheDocument();',
              ),
              (
                  'expect(screen.getByTestId("desk-todays-focus")).toHaveTextContent("Today\'s Focus");',
                  'expect(screen.getByTestId("desk-todays-focus")).toHaveTextContent("Right now");',
              ),
              (
                  'expect(managerReadCard.className).toContain("manager-read-card");',
                  'expect(managerReadCard.className).not.toContain("manager-read-card");',
              ),
          ]

          changed = 0
          for old, new in replacements:
              count = shell.count(old)
              if count:
                  shell = shell.replace(old, new)
                  changed += count
                  print(f"Updated {count} occurrence(s): {old}")

          if changed < 1:
              raise SystemExit("Expected stale Desk HQ/Home production-shell contracts")

          shell_path.write_text(shell)
          print(f"Updated {changed} stale production-shell contract occurrence(s)")
          PY
      - run: npm ci
      - name: Home editorial contract
        run: npm test -- src/desk-hq-editorial.test.tsx
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Production shell regressions
        run: npm test -- src/production-app-shell.test.tsx
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Visible naming contract
        run: |
          ! grep -F 'Desk HQ' src/features/desk/DeskHQ.tsx
          ! grep -F 'Desk HQ' src/design-system/components.tsx
          grep -F '{ label: "Home", active: "labelHQ"' src/design-system/components.tsx
      - name: Full repository suite
        run: npm test
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Commit Home redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/desk/DeskHQ.tsx src/design-system/components.tsx src/production-app-shell.test.tsx
          if git diff --cached --quiet; then
            echo "No generated source changes to commit"
            exit 0
          fi
          git commit -m "design: make Home the artist operating overview"
          git push origin HEAD:design/home-redesign
