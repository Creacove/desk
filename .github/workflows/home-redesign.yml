name: Home test contract fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/home-redesign.yml

permissions:
  contents: write

jobs:
  fix-test-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/home-redesign
          fetch-depth: 0
      - name: Fix metric readability source contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/production-app-shell.test.tsx")
          lines = path.read_text().splitlines()
          changed = 0
          for index, line in enumerate(lines):
              if 'metric.label}</p>' in line and '.toContain(' in line:
                  lines[index] = """    expect(readFileSync(join(process.cwd(), "src", "features", "desk", "DeskHQ.tsx"), "utf8")).toContain('break-words text-[11px] font-semibold leading-tight text-muted-foreground">{metric.label}</p>');"""
                  changed += 1
          if changed != 1:
              raise SystemExit(f"Expected exactly one metric label source contract, found {changed}")
          path.write_text("\n".join(lines) + "\n")
          PY
      - name: Commit test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/production-app-shell.test.tsx
          git commit -m "test: align metric readability contract with Home"
          git push origin HEAD:design/home-redesign
