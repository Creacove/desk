name: Hotfix Manager document tool budget

on:
  push:
    paths:
      - '.github/workflows/hotfix-manager-document-tool-budget.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Manager document turns
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('supabase/functions/manager-conversation/index.ts'),
              Path('supabase/functions/manager-conversation-stream/index.ts'),
          ]

          old = '''    initialToolChoice: managerConversationRequiresCanonicalDocumentTool({\n      body: input.body,\n      contextAnswers: input.contextAnswers,\n    }) ? "create_focused_song_document" : undefined,\n    jsonSchema: managerConversationJsonSchema,'''
          new = '''    initialToolChoice: managerConversationRequiresCanonicalDocumentTool({\n      body: input.body,\n      contextAnswers: input.contextAnswers,\n    }) && input.musicSubject ? "read_focused_music_subject" : undefined,\n    maxToolCalls: managerConversationRequiresCanonicalDocumentTool({\n      body: input.body,\n      contextAnswers: input.contextAnswers,\n    }) ? 24 : 8,\n    jsonSchema: managerConversationJsonSchema,'''

          for path in paths:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected Manager loop block not found in {path}')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Check Edge entrypoints
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno check
        run: |
          deno check supabase/functions/manager-conversation/index.ts
          deno check supabase/functions/manager-conversation-stream/index.ts

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/manager-conversation/index.ts supabase/functions/manager-conversation-stream/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: allow multi-document Manager turns to complete"
          git push origin HEAD:main
