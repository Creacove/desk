name: Missions contract migration
on:
  push:
    branches: [design/missions-zero-learning-ux]
permissions:
  contents: write
env:
  VITE_SUPABASE_URL: http://localhost:54321
  VITE_SUPABASE_ANON_KEY: ci-test-anon-key
jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[missions-contract-migrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/missions-zero-learning-ux
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix duplicate pending-state migration and apply contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/migrate-missions-zero-learning-tests.py')
          text = p.read_text()
          old = '''r(p, 'expect(screen.getByText("Manager reviewing")).toBeInTheDocument();', 'expect(screen.getByText("Saving…")).toBeInTheDocument();')
r(p, 'expect(screen.getByText("Manager reviewing")).toBeInTheDocument();', 'expect(screen.queryByText("Saving…")).not.toBeInTheDocument();\\n    expect(screen.getByText("Provide 90-day thesis")).toBeInTheDocument();')'''
          new = '''r(p, '''\'''    expect(screen.getByText("Manager reviewing")).toBeInTheDocument();

    resolveReview?.();\'''\''', '''\'''    expect(screen.getByText("Saving…")).toBeInTheDocument();

    resolveReview?.();\'''\''')
r(p, '''\'''    await waitFor(() => expect(onCompleteTask).toHaveResolved());
    expect(screen.getByText("Manager reviewing")).toBeInTheDocument();\'''\''', '''\'''    await waitFor(() => expect(onCompleteTask).toHaveResolved());
    expect(screen.queryByText("Saving…")).not.toBeInTheDocument();
    expect(screen.getByText("Provide 90-day thesis")).toBeInTheDocument();\'''\''')'''
          if old not in text:
              raise SystemExit('duplicate pending-state migration block not found')
          p.write_text(text.replace(old, new))
          PY
          python scripts/migrate-missions-zero-learning-tests.py
      - name: Run mission-focused tests
        run: npx vitest run src/mission-task-deliverables.test.tsx src/mission-workspace-simplification.test.tsx src/production-app-shell.test.tsx
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/missions src/mission-task-deliverables.test.tsx src/mission-workspace-simplification.test.tsx src/production-app-shell.test.tsx
          git diff --cached --check
          git commit -m "Migrate Missions to zero-learning contracts [missions-contract-migrated]"
          git push origin HEAD:design/missions-zero-learning-ux
