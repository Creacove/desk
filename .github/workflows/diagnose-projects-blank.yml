name: Diagnose Catalog Projects blank screen

on:
  push:
    branches:
      - hotfix/catalog-projects-blank-screen
    paths:
      - .github/workflows/diagnose-projects-blank.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Find project and orb call sites
        run: |
          echo '--- AppThinkingOrb usages ---'
          git grep -n 'AppThinkingOrb' -- src || true
          echo '--- .count accesses ---'
          git grep -nE '\.count\b' -- src || true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect thinking-orbs package
        run: |
          echo '--- thinking-orbs declarations/source ---'
          find node_modules/thinking-orbs -maxdepth 3 -type f -print
          grep -RniE 'size|count|20|64' node_modules/thinking-orbs | head -n 300 || true
      - name: Build
        run: npm run build
