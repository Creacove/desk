name: Repair Manager Static Contract Tests

on:
  push:
    branches:
      - fix/manager-production-stabilization
    paths:
      - scripts/repair-manager-static-contract-tests.py
      - .github/workflows/repair-manager-static-contract-tests.yml

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: http://localhost:54321
  VITE_SUPABASE_ANON_KEY: ci-test-anon-key

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Repair stale source-contract tests
        run: python scripts/repair-manager-static-contract-tests.py

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run full repository suite
        run: npm test

      - name: Remove one-shot repair files
        run: rm scripts/repair-manager-static-contract-tests.py .github/workflows/repair-manager-static-contract-tests.yml

      - name: Commit repaired contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align Manager contracts with current flow"
          git push
