name: Manager Song V2 Release Candidate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  VITE_SUPABASE_URL: http://localhost:54321
  VITE_SUPABASE_ANON_KEY: ci-test-anon-key

jobs:
  frontend:
    name: Manager Song V2 production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  manager-edge:
    name: Manager Edge type checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/manager-conversation/index.ts
      - run: deno check supabase/functions/manager-conversation-stream/index.ts

  v2-contract:
    name: Manager Song V2 focused contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/features/manager/managerSystemV2.test.ts --environment jsdom --pool=vmThreads
