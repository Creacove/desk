name: PR3 Save Label Repair

on:
  push:
    branches:
      - agent/record-servicing-manager-mode

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/record-servicing-manager-mode
          fetch-depth: 0

      - name: Update manual document save assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/production-app-shell.test.tsx')
          text = path.read_text()
          old = 'fireEvent.click(screen.getByRole("button", { name: "Save document" }));'
          new = 'fireEvent.click(screen.getByRole("button", { name: "Save revision" }));'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one stale Save document assertion, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr3-save-label-repair.yml
          git add src/production-app-shell.test.tsx
          git commit -m "test: align manual document save label"
          git push origin HEAD:agent/record-servicing-manager-mode
