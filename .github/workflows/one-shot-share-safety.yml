name: One-shot share safety patch

on:
  push:
    branches: [agent/record-servicing-manager-mode]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/record-servicing-manager-mode

      - name: Harden document sharing at the Edge boundary
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/functions/music-share-links/index.ts')
          source = path.read_text()

          select_old = 'db.from("documents").select("id,title,document_type,current_version_id,status")'
          select_new = 'db.from("documents").select("id,title,document_type,current_version_id,status,origin")'
          if source.count(select_old) != 1:
            raise SystemExit(f'Expected one document select anchor, found {source.count(select_old)}.')
          source = source.replace(select_old, select_new, 1)

          error_anchor = '  if (documentsError) throw documentsError;\n'
          safety = '''  if ((documents ?? []).length !== linkedIds.length) throw new Error("One or more selected documents are unavailable.");
          for (const document of documents ?? []) {
            const internalNarrative = document.document_type === "release_narrative"
              || cleanText(document.title, 180).toLowerCase() === "release narrative";
            if (internalNarrative) throw new Error("The internal Release Narrative cannot be shared.");
            if (document.origin === "manager_generated" && document.status !== "accepted") {
              throw new Error("Manager-built documents must be approved before sharing.");
            }
          }
          '''
          target = error_anchor + safety
          if source.count(error_anchor) < 1:
            raise SystemExit('Document error anchor was not found.')
          if 'The internal Release Narrative cannot be shared.' not in source:
            source = source.replace(error_anchor, target, 1)

          path.write_text(source)
          Path('.github/workflows/one-shot-share-safety.yml').unlink()

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/music-share-links/index.ts .github/workflows/one-shot-share-safety.yml
          git commit -m "fix: enforce share safety on the server"
          git push origin HEAD:agent/record-servicing-manager-mode
