name: PR3 Final Test Repair

on:
  push:
    branches:
      - agent/record-servicing-manager-mode

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/record-servicing-manager-mode
          fetch-depth: 0

      - name: Update final stale shell assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/production-app-shell.test.tsx')
          text = path.read_text()

          old_order = '''    expect(\n      within(songRoom)\n        .getByRole("button", { name: "Details" })\n        .compareDocumentPosition(within(songRoom).getByRole("button", { name: "Files" })) & Node.DOCUMENT_POSITION_FOLLOWING,\n    ).toBeTruthy();'''
          new_order = '''    expect(\n      within(songRoom)\n        .getByRole("button", { name: "Files" })\n        .compareDocumentPosition(within(songRoom).getByRole("button", { name: "Details" })) & Node.DOCUMENT_POSITION_FOLLOWING,\n    ).toBeTruthy();'''

          old_dialog = '    expect(screen.queryByRole("dialog", { name: /Write here/i })).not.toBeInTheDocument();'
          new_dialog = '    expect(screen.queryByRole("dialog", { name: /Write manually/i })).not.toBeInTheDocument();'

          if text.count(old_order) != 1:
              raise SystemExit(f'Expected one legacy tab-order assertion, found {text.count(old_order)}')
          if text.count(old_dialog) != 1:
              raise SystemExit(f'Expected one legacy document-dialog assertion, found {text.count(old_dialog)}')

          text = text.replace(old_order, new_order, 1).replace(old_dialog, new_dialog, 1)
          path.write_text(text)
          PY

      - name: Commit repairs and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr3-final-test-repair.yml
          git add src/production-app-shell.test.tsx
          git commit -m "test: align shell contracts with campaign UX"
          git push origin HEAD:agent/record-servicing-manager-mode
