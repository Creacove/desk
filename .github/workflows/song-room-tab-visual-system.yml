name: Song room tab visual system
on:
  push:
    paths:
      - scripts/song_room_tab_visual_system.py
      - .github/workflows/song-room-tab-visual-system.yml
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply song room visual system
        run: python3 scripts/song_room_tab_visual_system.py
      - run: npm ci
      - name: Focused design contract
        run: npx vitest run src/song-room-red-antler-overview.test.ts src/song-room-tab-design.test.ts --environment jsdom --pool=vmThreads
      - name: Full repository test suite
        run: npx vitest run --environment jsdom --pool=vmThreads
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Commit redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/music/MusicScreens.tsx src/song-room-tab-design.test.ts
          git commit -m 'feat: unify song room tab visual system'
          git push origin main
# validation trigger
