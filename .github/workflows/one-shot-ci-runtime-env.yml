name: One-shot CI runtime identity

on:
  push:
    branches: [agent/record-servicing-manager-mode]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/record-servicing-manager-mode
      - name: Add explicit production environment to config gate
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          source = path.read_text()
          anchor = '      VITE_APP_MODE: production\n      VITE_SUPABASE_URL:'
          replacement = '      VITE_APP_MODE: production\n      APP_ENVIRONMENT: production\n      VITE_SUPABASE_URL:'
          if '      APP_ENVIRONMENT: production\n' not in source:
            if source.count(anchor) != 1:
              raise SystemExit(f'Expected one production env anchor, found {source.count(anchor)}')
            source = source.replace(anchor, replacement, 1)
          path.write_text(source)
          Path('.github/workflows/one-shot-ci-runtime-env.yml').unlink()
      - name: Commit and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/one-shot-ci-runtime-env.yml
          git commit -m "ci: require production runtime identity"
          git push origin HEAD:agent/record-servicing-manager-mode
