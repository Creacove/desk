name: PR3 Contract Repair

on:
  push:
    branches:
      - agent/record-servicing-manager-mode

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/record-servicing-manager-mode
          fetch-depth: 0

      - name: Apply targeted contract updates
        run: python scripts/repair-pr3-test-contracts.py

      - name: Commit repaired contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/functions/_shared/manager-conversation/agentLoop.ts \
            src/manager-agent-loop.test.ts \
            src/openai-manager-conversation-function.test.ts \
            src/release-success-manager-tools.test.ts \
            src/production-app-shell.test.tsx
          git diff --cached --check
          git diff --cached --quiet && { echo "No contract changes needed."; exit 0; }
          git commit -m "test: align legacy contracts with campaign workspace"
          git push origin HEAD:agent/record-servicing-manager-mode
