name: Apply Manager turn contract

on:
  push:
    branches:
      - fix/manager-turn-contract

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: make Manager artifacts turn-scoped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/manager-turn-contract
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply systemic turn contract patch
        run: python scripts/apply_manager_turn_contract.py
      - name: Install dependencies
        run: npm ci
      - name: Test Manager artifact contract
        run: npx vitest run --environment jsdom --pool=vmThreads src/manager-turn-contract.test.ts src/features/manager/managerArtifactExperience.test.ts src/manager-document-navigation-contract.test.ts
      - name: Check Manager Edge functions
        run: deno check supabase/functions/manager-conversation/index.ts supabase/functions/manager-conversation-stream/index.ts
      - name: Build production frontend
        run: npm run build
      - name: Commit validated systemic fix
        run: |
          git rm .github/workflows/apply-manager-turn-contract.yml .github/workflows/inspect-manager-turn-contract.yml scripts/apply_manager_turn_contract.py
          git add supabase/functions/_shared/openaiManagerConversationLegacy.ts \
                  supabase/functions/_shared/manager-conversation/agentLoop.ts \
                  supabase/functions/_shared/manager-conversation/toolExecutor.ts \
                  supabase/functions/_shared/manager-conversation/turnContract.ts \
                  supabase/functions/manager-conversation/index.ts \
                  supabase/functions/manager-conversation-stream/index.ts \
                  src/types/cleanProduction.ts \
                  src/services/productionSupabase.ts \
                  src/features/manager/ManagerScreens.tsx \
                  src/features/manager/managerPresentation.ts \
                  src/manager-turn-contract.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make Manager artifacts turn-scoped and product-safe"
          git push origin HEAD:fix/manager-turn-contract
