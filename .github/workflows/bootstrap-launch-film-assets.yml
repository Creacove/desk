name: Bootstrap Launch Film Assets

on:
  push:
    branches:
      - marketing/meet-your-manager-motion
    paths:
      - .github/workflows/bootstrap-launch-film-assets.yml

permissions:
  contents: write

jobs:
  source-film-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout motion branch
        uses: actions/checkout@v5
        with:
          ref: marketing/meet-your-manager-motion
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Download source media
        run: |
          mkdir -p /tmp/launch-assets public/launch-assets/logos
          curl -L --fail --retry 3 -o /tmp/launch-assets/artist-studio.mp4 "https://videos.pexels.com/video-files/8135083/8135083-hd_1920_1080_25fps.mp4"
          curl -L --fail --retry 3 -o /tmp/launch-assets/live-performance.mp4 "https://videos.pexels.com/video-files/7804387/7804387-hd_1080_1920_25fps.mp4"
          curl -L --fail --retry 3 -o /tmp/launch-assets/crowd-phones.mp4 "https://videos.pexels.com/video-files/12719510/12719510-hd_1920_1080_60fps.mp4"

      - name: Create film-ready transcodes and posters
        run: |
          ffmpeg -y -i /tmp/launch-assets/artist-studio.mp4 -an -vf "scale=1280:-2" -c:v libx264 -preset medium -crf 25 -pix_fmt yuv420p -movflags +faststart public/launch-assets/artist-studio.mp4
          ffmpeg -y -ss 00:00:02 -i /tmp/launch-assets/artist-studio.mp4 -frames:v 1 -update 1 -vf "scale=1280:-2" -q:v 3 public/launch-assets/artist-studio-poster.jpg

          ffmpeg -y -i /tmp/launch-assets/live-performance.mp4 -an -vf "scale=720:-2" -c:v libx264 -preset medium -crf 25 -pix_fmt yuv420p -movflags +faststart public/launch-assets/live-performance.mp4
          ffmpeg -y -ss 00:00:02 -i /tmp/launch-assets/live-performance.mp4 -frames:v 1 -update 1 -vf "scale=720:-2" -q:v 3 public/launch-assets/live-performance-poster.jpg

          ffmpeg -y -i /tmp/launch-assets/crowd-phones.mp4 -an -vf "scale=1280:-2" -c:v libx264 -preset medium -crf 25 -pix_fmt yuv420p -movflags +faststart public/launch-assets/crowd-phones.mp4
          ffmpeg -y -ss 00:00:02 -i /tmp/launch-assets/crowd-phones.mp4 -frames:v 1 -update 1 -vf "scale=1280:-2" -q:v 3 public/launch-assets/crowd-phones-poster.jpg

      - name: Add platform context icons
        run: |
          curl -L --fail -o public/launch-assets/logos/spotify.svg "https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/spotify.svg"
          curl -L --fail -o public/launch-assets/logos/tiktok.svg "https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/tiktok.svg"
          curl -L --fail -o public/launch-assets/logos/instagram.svg "https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/instagram.svg"
          curl -L --fail -o public/launch-assets/logos/youtube.svg "https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/youtube.svg"

      - name: Rebase generated assets onto current motion head
        run: |
          git stash push --include-untracked -m launch-film-assets
          git fetch origin marketing/meet-your-manager-motion
          git rebase origin/marketing/meet-your-manager-motion
          git stash pop

      - name: Commit deterministic film assets
        run: |
          if git status --short -- public/launch-assets | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/launch-assets
            git commit -m "chore: add sourced launch film media"
            git push origin HEAD:marketing/meet-your-manager-motion
          else
            echo "Launch film assets already synchronized."
          fi
