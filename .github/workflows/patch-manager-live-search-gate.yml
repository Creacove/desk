name: Patch Manager live search gate

on:
  push:
    branches:
      - agent/premium-manager-artifact-experience

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Manager tool gate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/_shared/manager-conversation/agentLoop.ts')
          source = path.read_text()
          needle = '''export const managerConversationTools: ManagerAgentToolDefinition[] = [
            { type: "web_search" },'''
          replacement = '''const allowLiveExternalSearch = false;

          export const managerConversationTools: ManagerAgentToolDefinition[] = [
            ...(allowLiveExternalSearch ? [{ type: "web_search" as const }] : []),'''
          if needle not in source:
              raise SystemExit('expected managerConversationTools web_search declaration not found')
          path.write_text(source.replace(needle, replacement, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/manager-conversation/agentLoop.ts
          git commit -m "fix: gate Manager live external search"
          git push origin HEAD:${GITHUB_REF_NAME}
