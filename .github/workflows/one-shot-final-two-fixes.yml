name: One-shot final type fix

on:
  push:
    branches: [agent/record-servicing-manager-mode]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/record-servicing-manager-mode
      - name: Fix guarded document narrowing
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/features/music/MusicScreens.tsx')
          source = path.read_text()
          old = '    const document = target.document;\n'
          new = '    const document = target.document!;\n'
          if source.count(old) != 1:
            raise SystemExit(f'Expected exactly one guarded document anchor, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/music/MusicScreens.tsx
          git commit -m "fix: preserve guarded document type"
          git push origin HEAD:agent/record-servicing-manager-mode
