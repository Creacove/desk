name: Patch remaining mission test assertions

on:
  push:
    branches:
      - design/mission-workspace-simplification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/mission-workspace-simplification
          fetch-depth: 0

      - name: Patch exact remaining assertions
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/production-app-shell.test.tsx")
          text = path.read_text()

          def once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly 1 match, found {count}")
              text = text.replace(old, new, 1)

          once('    expect(await screen.findByRole("heading", { name: "Build manager-created audience loop" })).toBeInTheDocument();\n    expect(screen.getByRole("button", { name: /^Work/ })).toHaveAttribute("aria-pressed", "true");\n    expect(screen.getByText("Confirm task routing")).toBeInTheDocument();', '    expect(await screen.findByText("The path from here")).toBeInTheDocument();\n    expect(screen.getByRole("button", { name: /^Work/ })).toBeInTheDocument();\n    expect(screen.getByText("Confirm task routing")).toBeInTheDocument();', 'manager-created task destination')
          once('    expect(screen.getByRole("button", { name: /^Work/ })).toHaveAttribute("aria-pressed", "true");\n    expect(screen.getByText("The path from here")).toBeInTheDocument();\n    expect(screen.getAllByText("Confirm split sheet").length).toBeGreaterThan(0);\n    expect(screen.queryByRole("button", { name: /^Checkpoints/ })).not.toBeInTheDocument();\n    expect(screen.queryByRole("button", { name: /^Activity/ })).not.toBeInTheDocument();\n    fireEvent.click(screen.getByRole("button", { name: /^Updates/ }));\n    expect(screen.getByRole("button", { name: /^Updates/ })).toHaveAttribute("aria-pressed", "true");\n    expect(screen.getByRole("heading", { name: "What changed" })).toBeInTheDocument();', '    expect(screen.getByRole("button", { name: /^Work/ })).toBeInTheDocument();\n    expect(screen.getByText("The path from here")).toBeInTheDocument();\n    expect(screen.getAllByText("Confirm split sheet").length).toBeGreaterThan(0);\n    expect(screen.queryByRole("button", { name: /^Checkpoints/ })).not.toBeInTheDocument();\n    expect(screen.queryByRole("button", { name: /^Activity/ })).not.toBeInTheDocument();\n    fireEvent.click(screen.getByRole("button", { name: /^Updates/ }));\n    expect(screen.getByRole("heading", { name: "What changed" })).toBeInTheDocument();', 'mission work-updates navigation')
          once('    expect(await screen.findByText("The path from here")).toBeInTheDocument();\n    expect(screen.getByRole("button", { name: /^Work/ })).toHaveAttribute("aria-pressed", "true");\n    expect(screen.getByRole("button", { name: /^Updates/ })).toBeInTheDocument();', '    expect(await screen.findByText("The path from here")).toBeInTheDocument();\n    expect(screen.getByRole("button", { name: /^Work/ })).toBeInTheDocument();\n    expect(screen.getByRole("button", { name: /^Updates/ })).toBeInTheDocument();', 'mission work surface presence')
          once('    expect(within(missionCard).getByText("Confirm the release owner")).toBeInTheDocument();\n    expect(within(missionCard).getByText(/Release lane clarity.*0 of 2 done/)).toBeInTheDocument();', '    expect(within(missionCard).getByText("Collect release assets")).toBeInTheDocument();\n    expect(missionCard).toHaveTextContent(/Release lane clarity\\s*·\\s*0 of 2 done/);', 'mission card current work')
          once('    expect(within(firstStage).getByRole("button", { name: /Mobile hierarchy/i })).toHaveAttribute("aria-expanded", "true");\n    expect(within(secondStage).getByRole("button", { name: /Follow-up review/i })).toHaveAttribute("aria-expanded", "false");', '    expect(within(firstStage).getByRole("button", { name: /^Mobile hierarchy\\b/i })).toHaveAttribute("aria-expanded", "true");\n    expect(within(secondStage).getByRole("button", { name: /^Follow-up review\\b/i })).toHaveAttribute("aria-expanded", "false");', 'mobile checkpoint disclosures')

          path.write_text(text)
          PY

      - name: Commit patched assertions
        shell: bash
        run: |
          if git diff --quiet -- src/production-app-shell.test.tsx; then
            echo "No patch produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/production-app-shell.test.tsx
          git commit -m "test: finish mission integration contract migration"
          git push origin HEAD:design/mission-workspace-simplification
